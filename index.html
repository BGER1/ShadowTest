<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wohnungsnavigator</title>
  <!-- Grid test: frame 1 = 4x4 apartment overlay -->

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #222;
    }

    body {
      overflow: hidden;
    }

    /* =========================================================
       MAIN LAYOUT
    ========================================================= */

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .viewer-area {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #111;
    }

    /* =========================================================
       ORBIT VIEWER
    ========================================================= */

    #viewerCanvasWrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      background: #111;
    }

    #viewerCanvasWrapper.is-dragging {
      cursor: grabbing;
    }

    /*
      The main photo is always completely sharp.

      If the viewport is wider than the photo aspect ratio,
      only the empty SIDE areas are filled with a blurred copy.
      No blur is used above or below the actual photo.
    */

    .side-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease;
      background: #111;
    }

    .side-fill.is-visible {
      opacity: 1;
    }

    .side-fill img {
      position: absolute;
      top: -25px;
      width: 100vw;
      height: calc(100vh + 50px);
      object-fit: cover;
      object-position: center center;
      filter: blur(6px) brightness(1.08);
      transform: scale(1.015);
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    #sideFillLeft {
      left: 0;
    }

    #sideFillRight {
      right: 0;
    }

    #sideFillLeft img {
      left: 0;
    }

    #sideFillRight img {
      right: 0;
    }

    #orbitImage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    /* =========================================================
       APARTMENT GRID OVERLAY
       Multiple independently positioned Figma areas per frame.
    ========================================================= */

    #facadeGrid {
      position: absolute;
      inset: 0;
      z-index: 12;
      display: none;
      pointer-events: none;
      overflow: visible;
    }

    #facadeGrid.is-visible {
      display: block;
    }

    .facade-grid-area {
      position: absolute;
      overflow: visible;
      pointer-events: none;
    }

    .facade-grid-area svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .facade-grid-area polygon,
    .facade-grid-area path {
      fill: transparent;
      stroke: rgba(255,255,255,0.92);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
      pointer-events: all;
      transition: fill 0.16s ease, filter 0.16s ease;
    }

    .facade-grid-area polygon.status-verfuegbar:hover,
    .facade-grid-area path.status-verfuegbar:hover {
      fill: rgba(47,166,106,0.22);
      filter: drop-shadow(0 0 4px rgba(47,166,106,0.22));
    }

    .facade-grid-area polygon.status-reserviert:hover,
    .facade-grid-area path.status-reserviert:hover {
      fill: rgba(229,164,0,0.22);
      filter: drop-shadow(0 0 4px rgba(229,164,0,0.22));
    }

    .facade-grid-area polygon.status-verkauft:hover,
    .facade-grid-area path.status-verkauft:hover {
      fill: rgba(211,74,74,0.22);
      filter: drop-shadow(0 0 4px rgba(211,74,74,0.22));
    }

    .facade-grid-area polygon.group-hover.status-verfuegbar,
    .facade-grid-area path.group-hover.status-verfuegbar {
      fill: rgba(47,166,106,0.22);
      filter: drop-shadow(0 0 4px rgba(47,166,106,0.22));
    }

    .facade-grid-area polygon.group-hover.status-reserviert,
    .facade-grid-area path.group-hover.status-reserviert {
      fill: rgba(229,164,0,0.22);
      filter: drop-shadow(0 0 4px rgba(229,164,0,0.22));
    }

    .facade-grid-area polygon.group-hover.status-verkauft,
    .facade-grid-area path.group-hover.status-verkauft {
      fill: rgba(211,74,74,0.22);
      filter: drop-shadow(0 0 4px rgba(211,74,74,0.22));
    }

    /* =========================================================
       DRAG HINT
    ========================================================= */

    .drag-hint {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 20;
      padding: 10px 18px;
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .drag-hint.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(10px);
    }

    /* =========================================================
       COMPASS
    ========================================================= */

    .compass {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 30;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 4px 18px rgba(0,0,0,0.18);
      border: 1px solid rgba(0,0,0,0.08);
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .compass-dial {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      transition: transform 0.12s linear;
    }

    .compass-label {
      position: absolute;
      font-size: 10px;
      font-weight: 700;
      color: #333;
      line-height: 1;
    }

    .compass-label.n {
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      color: #b72828;
    }

    .compass-label.e {
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
    }

    .compass-label.s {
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
    }

    .compass-label.w {
      left: 5px;
      top: 50%;
      transform: translateY(-50%);
    }

    .compass-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #222;
      z-index: 2;
    }

    .compass-pointer {
      position: absolute;
      left: 50%;
      top: 8px;
      z-index: 3;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 9px solid #222;
      opacity: 0.75;
    }

    /* =========================================================
       BOTTOM-LEFT SEARCH / FILTER PANEL
    ========================================================= */

    .finder {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 35;
      width: min(350px, calc(100vw - 36px));
      max-height: 345px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 8px 30px rgba(0,0,0,0.22);
      border: 1px solid rgba(0,0,0,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .finder-controls {
      padding: 14px;
      border-bottom: 1px solid #e8e8e8;
    }

    .availability-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 11px;
      font-size: 13px;
      font-weight: 600;
    }

    .availability-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #258a54;
      cursor: pointer;
    }

    .finder-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .finder-control {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      background: #fff;
      color: #222;
      font-size: 12px;
      outline: none;
    }

    .finder-control:focus {
      border-color: #888;
    }

    .finder-search-row {
      display: grid;
      grid-template-columns: 115px 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .finder-results {
      overflow-y: auto;
      padding: 6px;
      max-height: 176px;
    }

    .finder-empty {
      padding: 18px 12px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    .apartment-result {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 10px 11px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .apartment-result:hover,
    .apartment-result.selected {
      background: #f0f0f0;
    }

    .result-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .result-meta {
      color: #6e6e6e;
      font-size: 11px;
      line-height: 1.4;
    }

    .result-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      white-space: nowrap;
      text-transform: capitalize;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-verfuegbar {
      background: #2fa66a;
    }

    .status-reserviert {
      background: #e5a400;
    }

    .status-verkauft {
      background: #d34a4a;
    }

    /* =========================================================
       LOADER
    ========================================================= */

    .loader {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #111;
      color: #fff;
    }

    .loader-text {
      font-size: 14px;
    }

    .loader-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      animation: loaderSpin 0.8s linear infinite;
    }

    @keyframes loaderSpin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       RIGHT DETAILS PANEL
       Hidden on startup. Opens only after selecting an apartment.
    ========================================================= */

    .panel {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 50;
      width: 390px;
      max-width: 92vw;
      height: calc(100vh - 28px);
      background: rgba(255,255,255,0.98);
      overflow-y: auto;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 18px;
      box-shadow: -10px 18px 45px rgba(0,0,0,0.18);
      transform: translateX(calc(100% + 30px)) scale(0.985);
      opacity: 0;
      transition:
        transform 0.38s cubic-bezier(.22,.8,.2,1),
        opacity 0.24s ease;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .panel.is-open {
      transform: translateX(0) scale(1);
      opacity: 1;
    }

    #viewerCanvasWrapper,
    .compass,
    .finder,
    .drag-hint {
      transition:
        transform 0.38s cubic-bezier(.22,.8,.2,1),
        opacity 0.25s ease;
    }

    @media (min-width: 901px) {
      body.panel-open #viewerCanvasWrapper {
        transform: translateX(-150px);
      }

      body.panel-open .compass,
      body.panel-open .finder,
      body.panel-open .drag-hint {
        transform: translateX(-90px);
      }
    }

    .panel-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid #e7e7e7;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .panel-header-title {
      font-size: 15px;
      font-weight: 700;
    }

    .panel-close {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #f1f1f1;
      color: #222;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .panel-close:hover {
      background: #e7e7e7;
    }

    .panel-content {
      padding: 22px 20px 28px;
    }

    .details-card.is-hidden {
      display: none;
    }

    .details-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 22px;
    }

    .details-title {
      font-size: 24px;
      font-weight: 700;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 20px;
      background: #eee;
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .badge.verfuegbar {
      background: #dff5e8;
      color: #207347;
    }

    .badge.reserviert {
      background: #fff0c5;
      color: #866500;
    }

    .badge.verkauft {
      background: #f7dede;
      color: #963434;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 12px;
    }

    .detail-label {
      margin-bottom: 4px;
      color: #777;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-value {
      font-size: 15px;
      font-weight: 600;
    }

    .plan-wrap {
      margin-top: 28px;
    }

    .details-plan {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .details-plan.is-hidden {
      display: none;
    }

    #detailsPlanEmpty {
      margin-top: 10px;
      color: #888;
      font-size: 13px;
    }

    .details-gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 24px;
    }

    .details-gallery img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .details-gallery img:first-child {
      grid-column: 1 / -1;
      aspect-ratio: 16 / 9;
    }

    .mobile-blur-bg,
    .mobile-details-bar {
      display: none;
    }

    .mobile-details-bar {
      background: #fff;
      border-top: 1px solid #ddd;
      padding: 14px 14px 16px;
    }

    .mobile-details-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .mobile-details-title {
      font-weight: 700;
      font-size: 18px;
    }

    .mobile-details-close {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: #f0f0f0;
      font-size: 18px;
      cursor: pointer;
    }

    .mobile-details-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .mobile-summary-item {
      padding: 9px;
      border-radius: 8px;
      background: #f5f5f5;
    }

    .mobile-summary-label {
      color: #777;
      font-size: 9px;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .mobile-summary-value {
      font-size: 13px;
      font-weight: 700;
    }

    .more-details-button {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 9px;
      background: #222;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 900px) {
      html,
      body {
        height: auto;
        min-height: 100%;
        background: #fff;
      }

      body {
        overflow-x: hidden;
        overflow-y: auto;
      }

      .app {
        width: 100%;
        height: auto;
        min-height: 100vh;
        overflow: visible;
        background: #fff;
      }

      .viewer-area {
        position: relative;
        inset: auto;
        height: 62vh;
        min-height: 380px;
        overflow: hidden;
        background: #111;
      }

      #viewerCanvasWrapper {
        position: absolute;
        inset: 0;
      }

      .mobile-blur-bg {
        display: block;
        position: absolute;
        inset: -28px;
        width: calc(100% + 56px);
        height: calc(100% + 56px);
        object-fit: cover;
        filter: blur(7px) brightness(1.08);
        transform: scale(1.02);
        opacity: 0.88;
        pointer-events: none;
        z-index: 0;
      }

      .side-fill {
        display: none !important;
      }

      #orbitImage {
        z-index: 2;
      }

      #facadeGrid {
        z-index: 12;
      }

      .compass {
        top: 12px;
        left: 12px;
        width: 64px;
        height: 64px;
      }

      .drag-hint {
        bottom: 12px;
        font-size: 12px;
        padding: 8px 13px;
      }

      .finder {
        position: relative;
        left: auto;
        bottom: auto;
        width: 100%;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
        border: 0;
        border-top: 1px solid #ddd;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .finder-controls {
        padding: 12px;
      }

      .finder-grid {
        grid-template-columns: 1fr 1fr;
      }

      .finder-search-row {
        grid-template-columns: 105px 1fr;
      }

      .finder-results {
        max-height: 154px;
        padding: 5px 8px 10px;
      }

      .mobile-details-bar.is-visible {
        display: block;
      }

      body.mobile-apartment-selected .finder {
        display: none;
      }

      .panel {
        position: fixed;
        inset: 0;
        width: 100%;
        max-width: 100%;
        height: 100dvh;
        z-index: 200;
        border-radius: 0;
        transform: translateY(105%);
        opacity: 1;
        transition: transform 0.28s ease;
        border: 0;
      }

      .panel.is-open {
        transform: translateY(0);
      }

      body.panel-open {
        overflow: hidden;
      }

      .details-gallery {
        grid-template-columns: 1fr;
      }

      .details-gallery img:first-child {
        grid-column: auto;
      }
    }

  
    .zoom-controls {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 36;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border-radius: 12px;
      background: rgba(255,255,255,0.94);
      box-shadow: 0 6px 20px rgba(0,0,0,0.16);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .zoom-controls button {
      min-width: 34px;
      height: 34px;
      padding: 0 9px;
      border: 0;
      border-radius: 8px;
      background: #f2f2f2;
      color: #222;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .zoom-controls button:hover {
      background: #e7e7e7;
    }

    #orbitImage,
    #facadeGrid {
      transform-origin: center center;
      transition: transform 0.16s ease;
    }

    @media (max-width: 900px) {
      .zoom-controls {
        right: 12px;
        bottom: 12px;
      }
    }

  </style>
</head>

<body>
  <div class="app">

    <main class="viewer-area">

      <div id="viewerCanvasWrapper">

        <div class="side-fill" id="sideFillLeft">
          <img id="sideFillLeftImage" src="" alt="" draggable="false">
        </div>

        <div class="side-fill" id="sideFillRight">
          <img id="sideFillRightImage" src="" alt="" draggable="false">
        </div>

        <img id="mobileBlurImage" class="mobile-blur-bg" src="" alt="" draggable="false">

        <img
          id="orbitImage"
          src=""
          alt="Gebäudeansicht"
          draggable="false"
        >
        <div id="facadeGrid" aria-label="Wohnungsraster"></div>

      </div>

      <div class="compass" aria-label="Kompass">
        <div class="compass-pointer"></div>

        <div class="compass-dial" id="compassDial">
          <span class="compass-label n">N</span>
          <span class="compass-label e">O</span>
          <span class="compass-label s">S</span>
          <span class="compass-label w">W</span>
          <span class="compass-center"></span>
        </div>
      </div>



      
      <div class="zoom-controls" aria-label="Zoom">
        <button id="zoomOut" type="button" aria-label="Herauszoomen">−</button>
        <button id="zoomReset" type="button" aria-label="Zoom zurücksetzen">1×</button>
        <button id="zoomIn" type="button" aria-label="Hineinzoomen">+</button>
      </div>

      <div class="drag-hint" id="dragHint">
        ← Ziehen zum Drehen →
      </div>

      <div class="loader" id="loader">
        <div class="loader-text" id="loaderInfo">
          Bilder werden geladen…
        </div>
        <div class="loader-spinner"></div>
      </div>

    </main>

      <section class="finder" aria-label="Wohnungssuche">
        <div class="finder-controls">

          <label class="availability-row">
            <input type="checkbox" id="availabilityToggle">
            <span>Nur verfügbare Wohnungen anzeigen</span>
          </label>

          <div class="finder-grid">
            <select id="sortBy" class="finder-control" aria-label="Sortieren">
              <option value="none">Sortieren nach …</option>
              <option value="price-asc">Preis: niedrig → hoch</option>

    /*
      Compass calibration:
      Frame 1 is currently treated as North (0°).
      If frame 1 points in another real direction later,
      change only this value.

      Example:
      Frame 1 points East -> 90
      Frame 1 points South -> 180
      Frame 1 points West -> 270
    */
    const INITIAL_HEADING_DEG = 0;

    /* =========================================================
       IMAGE PATHS
    ========================================================= */

    const imagePaths = [];

    for (let i = 1; i <= TOTAL_FRAMES; i++) {
      imagePaths.push(`models/${i}.jpg`);
    }

    /* =========================================================
       ELEMENTS
    ========================================================= */

    const wrapper = document.getElementById("viewerCanvasWrapper");
    const orbitImage = document.getElementById("orbitImage");
    const mobileBlurImage = document.getElementById("mobileBlurImage");
    const facadeGrid = document.getElementById("facadeGrid");

    const sideFillLeft = document.getElementById("sideFillLeft");
    const sideFillRight = document.getElementById("sideFillRight");
    const sideFillLeftImage = document.getElementById("sideFillLeftImage");
    const sideFillRightImage = document.getElementById("sideFillRightImage");

    const loader = document.getElementById("loader");
    const loaderInfo = document.getElementById("loaderInfo");
    const dragHint = document.getElementById("dragHint");
    const compassDial = document.getElementById("compassDial");
    const zoomIn = document.getElementById("zoomIn");
    const zoomOut = document.getElementById("zoomOut");
    const zoomReset = document.getElementById("zoomReset");

    const availabilityToggle = document.getElementById("availabilityToggle");
    const sortBy = document.getElementById("sortBy");
    const searchField = document.getElementById("searchField");
    const searchOperator = document.getElementById("searchOperator");
    const searchInput = document.getElementById("searchInput");
    const finderResults = document.getElementById("finderResults");

    const sidePanel = document.getElementById("sidePanel");
    const panelClose = document.getElementById("panelClose");
    const mobileDetailsBar = document.getElementById("mobileDetailsBar");
    const mobileDetailsTitle = document.getElementById("mobileDetailsTitle");
    const mobileDetailsPrice = document.getElementById("mobileDetailsPrice");
    const mobileDetailsSize = document.getElementById("mobileDetailsSize");
    const mobileDetailsRooms = document.getElementById("mobileDetailsRooms");
    const mobileDetailsClose = document.getElementById("mobileDetailsClose");
    const moreDetailsButton = document.getElementById("moreDetailsButton");

    /* =========================================================
       PRELOAD
    ========================================================= */

    const preloadedImages = [];
    let loadedCount = 0;
    let failedCount = 0;
    let currentFrame = 0;

    function updateLoader() {
      loaderInfo.textContent =
        `Lade Bilder ${loadedCount + failedCount} / ${TOTAL_FRAMES}`;
    }

    function finishLoading() {
      currentFrame = 0;

      try {
        setFrame(0);
      } catch (error) {
        console.error("Navigator konnte initial nicht vollständig gerendert werden:", error);
      } finally {
        loader.style.display = "none";
      }
    }

    imagePaths.forEach((src, index) => {
      const img = new Image();

      img.onload = () => {
        loadedCount++;
        updateLoader();

        if (loadedCount + failedCount === TOTAL_FRAMES) {
          finishLoading();
        }
      };

      img.onerror = () => {
        failedCount++;

        console.error(
          "Bild konnte nicht geladen werden:",
          src
        );

        updateLoader();

        if (loadedCount + failedCount === TOTAL_FRAMES) {
          finishLoading();
        }
      };

      img.src = src;
      preloadedImages[index] = img;
    });


    /* =========================================================
       ZOOM
       1.0x to 2.0x. Image and apartment mask are scaled together.
    ========================================================= */
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 2;
    const ZOOM_STEP = 0.1;
    let zoomLevel = 1;

    function applyZoom() {
      const transform = `scale(${zoomLevel})`;
      orbitImage.style.transform = transform;
      facadeGrid.style.transform = transform;
      zoomReset.textContent = `${zoomLevel.toFixed(1).replace(".0", "")}×`;
    }

    function setZoom(nextZoom) {
      zoomLevel = Math.min(
        MAX_ZOOM,
        Math.max(MIN_ZOOM, Math.round(nextZoom * 10) / 10)
      );
      applyZoom();
    }

    zoomIn.addEventListener("click", event => {
      event.stopPropagation();
      setZoom(zoomLevel + ZOOM_STEP);
    });

    zoomOut.addEventListener("click", event => {
      event.stopPropagation();
      setZoom(zoomLevel - ZOOM_STEP);
    });

    zoomReset.addEventListener("click", event => {
      event.stopPropagation();
      setZoom(1);
    });

    wrapper.addEventListener("wheel", event => {
      event.preventDefault();

      if (event.deltaY < 0) {
        setZoom(zoomLevel + ZOOM_STEP);
      } else {
        setZoom(zoomLevel - ZOOM_STEP);
      }
    }, { passive: false });

    /* =========================================================
       FRAME CONTROL
    ========================================================= */

    function normalizeFrame(index) {
      return ((index % TOTAL_FRAMES) + TOTAL_FRAMES) % TOTAL_FRAMES;
    }

    function setFrame(index) {
      currentFrame = normalizeFrame(index);

      const src = imagePaths[currentFrame];

      orbitImage.src = src;
      mobileBlurImage.src = src;
      sideFillLeftImage.src = src;
      sideFillRightImage.src = src;

      updateCompass();
      updateSideFillers();
      updateFacadeGrid();
      applyZoom();
    }

    /* =========================================================
       SIDE-ONLY BLUR
    ========================================================= */

    function updateSideFillers() {
      const image = preloadedImages[currentFrame];

      if (
        !image ||
        !image.naturalWidth ||
        !image.naturalHeight ||
        !wrapper.clientWidth ||
        !wrapper.clientHeight
      ) {
        sideFillLeft.style.width = "0px";
        sideFillRight.style.width = "0px";
        sideFillLeft.classList.remove("is-visible");
        sideFillRight.classList.remove("is-visible");
        return;
      }

      const viewerWidth = wrapper.clientWidth;
      const viewerHeight = wrapper.clientHeight;
      const imageAspect = image.naturalWidth / image.naturalHeight;
      const viewerAspect = viewerWidth / viewerHeight;

      /*
        object-fit: contain
        If viewer is wider than image, side bars appear.
        Only those side bars receive blur.
      */
      if (viewerAspect > imageAspect) {
        const containedWidth = viewerHeight * imageAspect;
        const sideWidth = Math.max(
          0,
          (viewerWidth - containedWidth) / 2
        );

        sideFillLeft.style.width = `${sideWidth}px`;
        sideFillRight.style.width = `${sideWidth}px`;

        sideFillLeft.classList.toggle(
          "is-visible",
          sideWidth > 1
        );

        sideFillRight.classList.toggle(
          "is-visible",
          sideWidth > 1
        );
      } else {
        sideFillLeft.style.width = "0px";
        sideFillRight.style.width = "0px";
        sideFillLeft.classList.remove("is-visible");
        sideFillRight.classList.remove("is-visible");
      }
    }

    window.addEventListener("resize", () => {
      updateSideFillers();
      updateFacadeGrid();
    });

    /* =========================================================
       COMPASS
    ========================================================= */

    function updateCompass() {
      const degreesPerFrame = 360 / TOTAL_FRAMES;

      const heading =
        INITIAL_HEADING_DEG +
        currentFrame * degreesPerFrame;

      /*
        Dial rotates opposite to the camera heading,
        like a normal compass.
      */
      compassDial.style.transform =
        `rotate(${-heading}deg)`;
    }

    /* =========================================================
       DRAGGING
       Direction kept exactly like your current version:
       LEFT  -> previous frame
       RIGHT -> next frame
    ========================================================= */

    let isDragging = false;
    let lastX = 0;
    let dragAccumulator = 0;
    let dragDistance = 0;
    let suppressNextApartmentClick = false;
    let pendingApartmentFromGrid = null;
    let hasInteracted = false;

    function startDragging(event) {
      if (
        event.pointerType === "mouse" &&
        event.button !== 0
      ) {
        return;
      }

      isDragging = true;
      lastX = event.clientX;
      dragAccumulator = 0;
      dragDistance = 0;
      suppressNextApartmentClick = false;

      wrapper.classList.add("is-dragging");

      try {
        wrapper.setPointerCapture(event.pointerId);
      } catch (error) {}

      if (!hasInteracted) {
        hasInteracted = true;
        dragHint.classList.add("hidden");
      }
    }

    function moveDragging(event) {
      if (!isDragging) {
        return;
      }

      const movement = event.clientX - lastX;
      lastX = event.clientX;
      dragAccumulator += movement;
      dragDistance += Math.abs(movement);

      while (
        Math.abs(dragAccumulator) >= PIXELS_PER_FRAME
      ) {
        if (dragAccumulator < 0) {
          setFrame(currentFrame - 1);
          dragAccumulator += PIXELS_PER_FRAME;
        } else {
          setFrame(currentFrame + 1);
          dragAccumulator -= PIXELS_PER_FRAME;
        }
      }
    }

    function stopDragging(event) {
      if (!isDragging) {
        return;
      }

      isDragging = false;
      const wasDrag = dragDistance > 6;
      suppressNextApartmentClick = wasDrag;
      wrapper.classList.remove("is-dragging");

      if (
        event &&
        event.pointerId !== undefined
      ) {
        try {
          wrapper.releasePointerCapture(event.pointerId);
        } catch (error) {}
      }

      if (!wasDrag && pendingApartmentFromGrid) {
        const apartmentToOpen = pendingApartmentFromGrid;
        pendingApartmentFromGrid = null;
        suppressNextApartmentClick = true;
        selectApartment(apartmentToOpen);
      } else {
        pendingApartmentFromGrid = null;
      }
    }

    wrapper.addEventListener("pointerdown", startDragging);
    wrapper.addEventListener("pointermove", moveDragging);
    wrapper.addEventListener("pointerup", stopDragging);
    wrapper.addEventListener("pointercancel", stopDragging);

    /* =========================================================
       KEYBOARD
    ========================================================= */

    window.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") {
        setFrame(currentFrame - 1);
      }

      if (event.key === "ArrowRight") {
        setFrame(currentFrame + 1);
      }

      if (event.key === "Escape") {
        closeDetailsPanel();
      }
    });

    /* =========================================================
       TEMP APARTMENT DATA
       Keep/replace this with your real data later.
    ========================================================= */

    const demoStatuses = [
      "verfügbar", "reserviert", "verkauft", "verfügbar",
      "verkauft", "verfügbar", "reserviert", "verfügbar",
      "verfügbar", "verkauft", "verfügbar", "reserviert",
      "verkauft", "verfügbar", "reserviert", "verfügbar"
    ];

    const apartments = Array.from({ length: 48 }, (_, index) => {
      const top = index + 1;
      const row = Math.floor(index / 4);
      const col = index % 4;

      return {
        id: `Top_${top}`,
        number: `Top ${top}`,
        floor: row === 0 ? "EG" : `${row}. OG`,
        size: `${58 + ((index * 7) % 38)} m²`,
        price: `€ ${(395000 + index * 18500).toLocaleString("de-DE")}`,
        status: demoStatuses[index % demoStatuses.length],
        rooms: String(2 + (col % 3)),
        orientation: ["Süd", "West", "Ost", "Süd-West"][col],
        outdoor: row === 0 ? "Terrasse" : "Balkon",
        plan: `https://placehold.co/900x650/f4f4f4/333333?text=Demo+Grundriss+Top+${top}`,
        gallery: [
          `https://picsum.photos/seed/top-${top}-living/900/600`,
          `https://picsum.photos/seed/top-${top}-kitchen/700/525`,
          `https://picsum.photos/seed/top-${top}-bedroom/700/525`
        ]
      };
    });

    /* =========================================================
       MULTI-GRID RENDERER
       Supports old cropped SVG areas and new full-frame SVG paths.
    ========================================================= */

    function gridLerp(a, b, t) {
      return {
        x: a.x + (b.x - a.x) * t,
        y: a.y + (b.y - a.y) * t
      };
    }

    function gridPointAt(config, row, col) {
      const rows = config.rows;
      const cols = config.cols;

      const topU = config.columnFractionsTop?.[col] ?? (col / cols);
      const bottomU = config.columnFractionsBottom?.[col] ?? (col / cols);
      const leftV = config.rowFractionsLeft?.[row] ?? (row / rows);
      const rightV = config.rowFractionsRight?.[row] ?? (row / rows);

      const topPoint = gridLerp(config.corners[0], config.corners[1], topU);
      const bottomPoint = gridLerp(config.corners[3], config.corners[2], bottomU);
      const averageU = (topU + bottomU) / 2;
      const v = leftV + (rightV - leftV) * averageU;

      return gridLerp(topPoint, bottomPoint, v);
    }

    function getApartmentByTopNumber(topNumber) {
      let apartment = apartments.find(item => item.id === `Top_${topNumber}`);

      if (!apartment) {
        const statusCycle = ["verfügbar", "reserviert", "verkauft"];
        apartment = {
          id: `Top_${topNumber}`,
          number: `Top ${topNumber}`,
          floor: "—",
          size: "—",
          price: "—",
          status: statusCycle[(topNumber - 1) % statusCycle.length],
          rooms: "—",
          orientation: "—",
          outdoor: "—",
          plan: `https://placehold.co/900x650/f4f4f4/333333?text=Demo+Grundriss+Top+${topNumber}`,
          gallery: [
            `https://picsum.photos/seed/top-${topNumber}-living/900/600`,
            `https://picsum.photos/seed/top-${topNumber}-kitchen/700/525`,
            `https://picsum.photos/seed/top-${topNumber}-bedroom/700/525`
          ]
        };
      }

      return apartment;
    }

    function normalizeApartmentRefs(refValue) {
      const refs = Array.isArray(refValue) ? refValue : [refValue];

      return refs.map(topNumber => {
        return getApartmentByTopNumber(topNumber);
      });
    }

    function setApartmentGroupHover(apartmentIds, active) {
      apartmentIds.forEach(apartmentId => {
        const selector = `[data-apartment-ids~="${apartmentId}"]`;

        facadeGrid.querySelectorAll(selector).forEach(shape => {
          shape.classList.toggle("group-hover", active);
        });
      });
    }

    function attachApartmentInteraction(shape, apartmentRefs, configName) {
      const apartmentsForShape = normalizeApartmentRefs(apartmentRefs);
      const apartmentIds = apartmentsForShape.map(apartment => apartment.id);

      /*
        A shared visual surface can belong to more than one apartment.
        For the color we use the first mapped apartment as the temporary
        demo status. Individual real statuses can be wired later.
      */
      const primaryApartment = apartmentsForShape[0];
      const statusClass = getStatusClass(primaryApartment.status);

      if (statusClass) {
        shape.classList.add(statusClass);
      }

      shape.dataset.apartmentIds = apartmentIds.join(" ");

      shape.setAttribute(
        "aria-label",
        `${configName}: ${apartmentsForShape.map(a => a.number).join(", ")}`
      );

      shape.addEventListener("pointerenter", () => {
        setApartmentGroupHover(apartmentIds, true);
      });

      shape.addEventListener("pointerleave", () => {
        setApartmentGroupHover(apartmentIds, false);
      });

      shape.addEventListener("pointerdown", () => {
        /*
          If a shared surface contains several apartments, clicking it opens
          the first apartment named in the Figma layer. All referenced
          apartments still participate in the linked hover.
        */
        pendingApartmentFromGrid = primaryApartment;
      });

      shape.addEventListener("click", event => {
        event.stopPropagation();

        if (suppressNextApartmentClick) {
          suppressNextApartmentClick = false;
          return;
        }

        selectApartment(primaryApartment);
      });
    }

    function renderGridArea(config) {
      const area = document.createElement("div");
      area.className = "facade-grid-area";
      area.dataset.gridName = config.name;

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${config.svgWidth} ${config.svgHeight}`);
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("aria-label", config.name);

      // Single irregular Figma path: keep the exact geometry.
      if (config.path && config.rows === 1 && config.cols === 1) {
        const apartmentRefs = config.apartments[0][0];
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", config.path);
        attachApartmentInteraction(path, apartmentRefs, config.name);
        svg.appendChild(path);
      } else {
        for (let row = 0; row < config.rows; row++) {
          for (let col = 0; col < config.cols; col++) {
            const apartmentRefs = config.apartments[row][col];
            const p1 = gridPointAt(config, row, col);
            const p2 = gridPointAt(config, row, col + 1);
            const p3 = gridPointAt(config, row + 1, col + 1);
            const p4 = gridPointAt(config, row + 1, col);

            const polygon = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "polygon"
            );

            polygon.setAttribute(
              "points",
              `${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y} ${p4.x},${p4.y}`
            );

            attachApartmentInteraction(polygon, apartmentRefs, config.name);
            svg.appendChild(polygon);
          }
        }
      }

      area.appendChild(svg);
      facadeGrid.appendChild(area);
      return area;
    }

    function updateFacadeGrid() {
      facadeGrid.innerHTML = "";

      const configs = FRAME_GRIDS[currentFrame];
      if (!configs) {
        facadeGrid.classList.remove("is-visible");
        return;
      }

      const image = preloadedImages[currentFrame];

      if (
        !image || !image.naturalWidth || !image.naturalHeight ||
        !wrapper.clientWidth || !wrapper.clientHeight
      ) {
        facadeGrid.classList.remove("is-visible");
        return;
      }

      const viewerWidth = wrapper.clientWidth;
      const viewerHeight = wrapper.clientHeight;
      const imageAspect = image.naturalWidth / image.naturalHeight;
      const viewerAspect = viewerWidth / viewerHeight;

      let shownWidth, shownHeight, imageLeft, imageTop;

      if (viewerAspect > imageAspect) {
        shownHeight = viewerHeight;
        shownWidth = shownHeight * imageAspect;
        imageLeft = (viewerWidth - shownWidth) / 2;
        imageTop = 0;
      } else {
        shownWidth = viewerWidth;
        shownHeight = shownWidth / imageAspect;
        imageLeft = 0;
        imageTop = (viewerHeight - shownHeight) / 2;
      }

      configs.forEach(config => {
        const area = renderGridArea(config);

        if (config.fullFrame) {
          // New workflow: SVG coordinates are already absolute in the 4000x2250 photo.
          const frameOffset = GRID_FRAME_OFFSETS[currentFrame] || { x: 0, y: 0 };
          const offsetScaleX = shownWidth / config.svgWidth;
          const offsetScaleY = shownHeight / config.svgHeight;

          area.style.left = `${imageLeft + frameOffset.x * offsetScaleX}px`;
          area.style.top = `${imageTop + frameOffset.y * offsetScaleY}px`;
          area.style.width = `${shownWidth}px`;
          area.style.height = `${shownHeight}px`;
        } else {
          // Legacy workflow for image 1.
          const gridWidth = shownWidth * (config.widthPct / 100);
          const gridHeight = gridWidth * (config.svgHeight / config.svgWidth);

          area.style.left = `${imageLeft + shownWidth * (config.leftPct / 100)}px`;
          area.style.top = `${imageTop + shownHeight * (config.topPct / 100)}px`;
          area.style.width = `${gridWidth}px`;
          area.style.height = `${gridHeight}px`;
        }
      });

      facadeGrid.classList.add("is-visible");
    }

    /* =========================================================
       HELPERS
    ========================================================= */

    function parseNumber(value) {
      if (value === null || value === undefined) {
        return 0;
      }

      const normalized = String(value)
        .replace(/\./g, "")
        .replace(",", ".")
        .replace(/[^\d.-]/g, "");

      return Number(normalized) || 0;
    }

    function getApartmentNumericValue(apartment, field) {
      if (field === "price") {
        return parseNumber(apartment.price);
      }

      if (field === "rooms") {
        return parseNumber(apartment.rooms);
      }

      if (field === "size") {
        return parseNumber(apartment.size);
      }

      return 0;
    }

    function getStatusClass(status) {
      if (status === "verfügbar") {
        return "status-verfuegbar";
      }

      if (status === "reserviert") {
        return "status-reserviert";
      }

      if (status === "verkauft") {
        return "status-verkauft";
      }

      return "";
    }

    /* =========================================================
       FILTER / SEARCH / SORT
    ========================================================= */

    let selectedApartmentId = null;

    function apartmentMatchesSearch(apartment) {
      const rawQuery = searchInput.value.trim();

      if (!rawQuery) {
        return true;
      }

      const field = searchField.value;
      const operator = searchOperator.value;
      const queryNumber = parseNumber(rawQuery);

      /*
        "All parameters" searches price, rooms and size together.
      */
      const fields =
        field === "all"
          ? ["price", "rooms", "size"]
          : [field];

      return fields.some(currentField => {
        const apartmentValue =
          getApartmentNumericValue(apartment, currentField);

        if (operator === "max") {
          return apartmentValue <= queryNumber;
        }

        if (operator === "min") {
          return apartmentValue >= queryNumber;
        }

        /*
          For "contains / ca.":
          - numeric equality for rooms
          - text/numeric partial match for price & size
        */
        if (currentField === "rooms") {
          return apartmentValue === queryNumber;
        }

        const apartmentText =
          String(apartmentValue);

        const queryText =
          String(queryNumber);

        return (
          apartmentText.includes(queryText) ||
          Math.abs(apartmentValue - queryNumber) <=
            Math.max(1, apartmentValue * 0.02)
        );
      });
    }

    function getFilteredSortedApartments() {
      let result = apartments.filter(apartment => {
        if (
          availabilityToggle.checked &&
          apartment.status !== "verfügbar"
        ) {
          return false;
        }

        return apartmentMatchesSearch(apartment);
      });

      const sortValue = sortBy.value;

      const sortMap = {
        "price-asc": ["price", 1],
        "price-desc": ["price", -1],
        "rooms-asc": ["rooms", 1],
        "rooms-desc": ["rooms", -1],
        "size-asc": ["size", 1],
        "size-desc": ["size", -1]
      };

      if (sortMap[sortValue]) {
        const [field, direction] = sortMap[sortValue];

        result = [...result].sort((a, b) => {
          return (
            getApartmentNumericValue(a, field) -
            getApartmentNumericValue(b, field)
          ) * direction;
        });
      }

      return result;
    }

    function renderApartmentResults() {
      finderResults.innerHTML = "";

      const filteredApartments =
        getFilteredSortedApartments();

      if (!filteredApartments.length) {
        finderResults.innerHTML =
          `<div class="finder-empty">
            Keine passenden Wohnungen gefunden.
          </div>`;
        return;
      }

      filteredApartments.forEach(apartment => {
        const button =
          document.createElement("button");

        button.type = "button";
        button.className = "apartment-result";

        if (apartment.id === selectedApartmentId) {
          button.classList.add("selected");
        }

        button.innerHTML = `
          <div>
            <div class="result-title">
              ${apartment.number}
            </div>

            <div class="result-meta">
              ${apartment.floor}
              · ${apartment.rooms} Zimmer
              · ${apartment.size}
              · ${apartment.price}
            </div>
          </div>

          <div class="result-status">
            <span
              class="status-dot ${getStatusClass(apartment.status)}"
            ></span>
            ${apartment.status}
          </div>
        `;

        button.addEventListener("click", () => {
          selectApartment(apartment);
        });

        finderResults.appendChild(button);
      });
    }

    availabilityToggle.addEventListener(
      "change",
      renderApartmentResults
    );

    sortBy.addEventListener(
      "change",
      renderApartmentResults
    );

    searchField.addEventListener(
      "change",
      renderApartmentResults
    );

    searchOperator.addEventListener(
      "change",
      renderApartmentResults
    );

    searchInput.addEventListener(
      "input",
      renderApartmentResults
    );

    /* =========================================================
       DETAILS
    ========================================================= */

    const detailsCard =
      document.getElementById("detailsCard");

    const detailsTitle =
      document.getElementById("detailsTitle");

    const detailsBadge =
      document.getElementById("detailsBadge");

    const detailsSize =
      document.getElementById("detailsSize");

    const detailsPrice =
      document.getElementById("detailsPrice");

    const detailsRooms =
      document.getElementById("detailsRooms");

    const detailsFloor =
      document.getElementById("detailsFloor");

    const detailsOrientation =
      document.getElementById("detailsOrientation");

    const detailsOutdoor =
      document.getElementById("detailsOutdoor");

    const detailsGallery =
      document.getElementById("detailsGallery");

    const detailsPlan =
      document.getElementById("detailsPlan");

    const detailsPlanEmpty =
      document.getElementById("detailsPlanEmpty");

    function isMobileLayout() {
      return window.matchMedia("(max-width: 900px)").matches;
    }

    function openDetailsPanel() {
      sidePanel.classList.add("is-open");
      sidePanel.setAttribute("aria-hidden", "false");
      document.body.classList.add("panel-open");
    }

    function closeDetailsPanel() {
      sidePanel.classList.remove("is-open");
      sidePanel.setAttribute("aria-hidden", "true");
      document.body.classList.remove("panel-open");
    }

    function closeMobileDetails() {
      mobileDetailsBar.classList.remove("is-visible");
      document.body.classList.remove("mobile-apartment-selected");
    }

    panelClose.addEventListener("click", closeDetailsPanel);
    mobileDetailsClose.addEventListener("click", closeMobileDetails);

    moreDetailsButton.addEventListener("click", () => {
      openDetailsPanel();
    });

    function populateFullDetails(apartment) {
      detailsTitle.textContent = apartment.number;
      detailsSize.textContent = apartment.size;
      detailsPrice.textContent = apartment.price;
      detailsRooms.textContent = apartment.rooms;
      detailsFloor.textContent = apartment.floor;
      detailsOrientation.textContent = apartment.orientation;
      detailsOutdoor.textContent = apartment.outdoor;

      detailsBadge.textContent = apartment.status;
      detailsBadge.className = "badge";

      if (apartment.status === "verfügbar") {
        detailsBadge.classList.add("verfuegbar");
      } else if (apartment.status === "reserviert") {
        detailsBadge.classList.add("reserviert");
      } else if (apartment.status === "verkauft") {
        detailsBadge.classList.add("verkauft");
      }

      detailsGallery.innerHTML = "";
      (apartment.gallery || []).forEach((src, index) => {
        const image = document.createElement("img");
        image.src = src;
        image.alt = `${apartment.number} Innenansicht ${index + 1}`;
        image.loading = "lazy";
        detailsGallery.appendChild(image);
      });

      if (apartment.plan) {
        detailsPlan.src = apartment.plan;
        detailsPlan.classList.remove("is-hidden");
        detailsPlanEmpty.style.display = "none";
      } else {
        detailsPlan.src = "";
        detailsPlan.classList.add("is-hidden");
        detailsPlanEmpty.style.display = "block";
      }

      detailsCard.classList.remove("is-hidden");
    }

    function selectApartment(apartment) {
      selectedApartmentId = apartment.id;
      populateFullDetails(apartment);

      if (isMobileLayout()) {
        closeDetailsPanel();
        mobileDetailsTitle.textContent = `${apartment.number} · ${apartment.status}`;
        mobileDetailsPrice.textContent = apartment.price;
        mobileDetailsSize.textContent = apartment.size;
        mobileDetailsRooms.textContent = apartment.rooms;
        mobileDetailsBar.classList.add("is-visible");
        document.body.classList.add("mobile-apartment-selected");
      } else {
        openDetailsPanel();
      }

      renderApartmentResults();
    }

    /* =========================================================
       INIT
    ========================================================= */

    renderApartmentResults();
    updateCompass();
    updateSideFillers();
    updateFacadeGrid();
  </script>
</body>
