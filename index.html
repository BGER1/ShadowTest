<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wohnungsnavigator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fahkwang:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Grid test: frame 1 = 4x4 apartment overlay -->

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #222;
    }

    body {
      overflow: hidden;
    }

    /* =========================================================
       MAIN LAYOUT
    ========================================================= */

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .viewer-area {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #111;
    }

    /* =========================================================
       ORBIT VIEWER
    ========================================================= */

    #viewerCanvasWrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      background: #111;
    }

    #viewerCanvasWrapper.is-dragging {
      cursor: grabbing;
    }

    /*
      The main photo is always completely sharp.

      If the viewport is wider than the photo aspect ratio,
      only the empty SIDE areas are filled with a blurred copy.
      No blur is used above or below the actual photo.
    */

    .side-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease;
      background: #111;
    }

    .side-fill.is-visible {
      opacity: 1;
    }

    .side-fill img {
      position: absolute;
      top: -25px;
      width: 100vw;
      height: calc(100vh + 50px);
      object-fit: cover;
      object-position: center center;
      filter: blur(6px) brightness(1.08);
      transform: scale(1.015);
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    #sideFillLeft {
      left: 0;
    }

    #sideFillRight {
      right: 0;
    }

    #sideFillLeft img {
      left: 0;
    }

    #sideFillRight img {
      right: 0;
    }

    #orbitImage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    /* =========================================================
       APARTMENT GRID OVERLAY
       Multiple independently positioned Figma areas per frame.
    ========================================================= */

    #facadeGrid {
      position: absolute;
      inset: 0;
      z-index: 12;
      display: none;
      pointer-events: none;
      overflow: visible;
    }

    #facadeGrid.is-visible {
      display: block;
    }

    .facade-grid-area {
      position: absolute;
      overflow: visible;
      pointer-events: none;
    }

    .facade-grid-area svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .facade-grid-area polygon,
    .facade-grid-area path {
      fill: transparent;
      stroke: transparent;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
      pointer-events: all;
      transition: fill 0.16s ease, filter 0.16s ease;
    }

    .facade-grid-area polygon:hover,
    .facade-grid-area path:hover,
    .facade-grid-area polygon.group-hover,
    .facade-grid-area path.group-hover {
      fill: rgba(255,255,255,0.72);
      filter: drop-shadow(0 0 9px rgba(255,255,255,0.95));
    }

    .facade-grid-area polygon.filter-match,
    .facade-grid-area path.filter-match {
      fill: rgba(255,255,255,0.46);
      filter: drop-shadow(0 0 7px rgba(255,255,255,0.8));
    }

    .facade-grid-area polygon.filter-hidden,
    .facade-grid-area path.filter-hidden {
      pointer-events: none;
      fill: transparent;
      filter: none;
    }

    /* =========================================================
       DRAG HINT
    ========================================================= */

    .drag-hint {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 20;
      padding: 10px 18px;
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .drag-hint.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(10px);
    }

    /* =========================================================
       COMPASS
    ========================================================= */

    .compass {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 30;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 4px 18px rgba(0,0,0,0.18);
      border: 1px solid rgba(0,0,0,0.08);
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .compass-dial {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      transition: transform 0.12s linear;
    }

    .compass-label {
      position: absolute;
      font-size: 10px;
      font-weight: 700;
      color: #333;
      line-height: 1;
    }

    .compass-label.n {
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      color: #b72828;
    }

    .compass-label.e {
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
    }

    .compass-label.s {
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
    }

    .compass-label.w {
      left: 5px;
      top: 50%;
      transform: translateY(-50%);
    }

    .compass-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #222;
      z-index: 2;
    }

    .compass-pointer {
      position: absolute;
      left: 50%;
      top: 8px;
      z-index: 3;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 9px solid #222;
      opacity: 0.75;
    }

    /* =========================================================
       BOTTOM-LEFT SEARCH / FILTER PANEL
    ========================================================= */

    .finder {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 35;
      width: min(350px, calc(100vw - 36px));
      max-height: 345px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 8px 30px rgba(0,0,0,0.22);
      border: 1px solid rgba(0,0,0,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .finder-controls {
      padding: 14px;
      border-bottom: 1px solid #e8e8e8;
    }

    .availability-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 11px;
      font-size: 13px;
      font-weight: 600;
    }

    .availability-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #258a54;
      cursor: pointer;
    }

    .finder-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .finder-control {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      background: #fff;
      color: #222;
      font-size: 12px;
      outline: none;
    }

    .finder-control:focus {
      border-color: #888;
    }

    .finder-search-row {
      display: grid;
      grid-template-columns: 115px 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .finder-results {
      overflow-y: auto;
      padding: 6px;
      max-height: 176px;
    }

    .finder-empty {
      padding: 18px 12px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    .apartment-result {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 10px 11px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .apartment-result:hover,
    .apartment-result.selected {
      background: #f0f0f0;
    }

    .result-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .result-meta {
      color: #6e6e6e;
      font-size: 11px;
      line-height: 1.4;
    }

    .result-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      white-space: nowrap;
      text-transform: capitalize;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-verfuegbar {
      background: #2fa66a;
    }

    .status-reserviert {
      background: #e5a400;
    }

    .status-verkauft {
      background: #d34a4a;
    }

    /* =========================================================
       LOADER
    ========================================================= */

    .loader {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #111;
      color: #fff;
    }

    .loader-text {
      font-size: 14px;
    }

    .loader-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      animation: loaderSpin 0.8s linear infinite;
    }

    @keyframes loaderSpin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       RIGHT DETAILS PANEL
       Hidden on startup. Opens only after selecting an apartment.
    ========================================================= */

    .panel {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 50;
      width: 390px;
      max-width: 92vw;
      height: calc(100vh - 28px);
      background: rgba(255,255,255,0.98);
      overflow-y: auto;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 18px;
      box-shadow: -10px 18px 45px rgba(0,0,0,0.18);
      transform: translateX(calc(100% + 30px)) scale(0.985);
      opacity: 0;
      transition:
        transform 0.38s cubic-bezier(.22,.8,.2,1),
        opacity 0.24s ease;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .panel.is-open {
      transform: translateX(0) scale(1);
      opacity: 1;
    }

    #viewerCanvasWrapper,
    .compass,
    .finder,
    .drag-hint {
      transition:
        transform 0.38s cubic-bezier(.22,.8,.2,1),
        opacity 0.25s ease;
    }

    @media (min-width: 901px) {
      body.panel-open #viewerCanvasWrapper {
        transform: translateX(-150px);
      }

      body.panel-open .compass,
      body.panel-open .finder,
      body.panel-open .drag-hint {
        transform: translateX(-90px);
      }
    }

    .panel-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid #e7e7e7;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .panel-header-title {
      font-size: 15px;
      font-weight: 700;
    }

    .panel-close {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #f1f1f1;
      color: #222;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .panel-close:hover {
      background: #e7e7e7;
    }

    .panel-content {
      padding: 22px 20px 28px;
    }

    .details-card.is-hidden {
      display: none;
    }

    .details-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 22px;
    }

    .details-title {
      font-size: 24px;
      font-weight: 700;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 20px;
      background: #eee;
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .badge.verfuegbar {
      background: #dff5e8;
      color: #207347;
    }

    .badge.reserviert {
      background: #fff0c5;
      color: #866500;
    }

    .badge.verkauft {
      background: #f7dede;
      color: #963434;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 12px;
    }

    .detail-label {
      margin-bottom: 4px;
      color: #777;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-value {
      font-size: 15px;
      font-weight: 600;
    }

    .plan-wrap {
      margin-top: 28px;
    }

    .details-plan {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .details-plan.is-hidden {
      display: none;
    }

    #detailsPlanEmpty {
      margin-top: 10px;
      color: #888;
      font-size: 13px;
    }

    .details-gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 24px;
    }

    .details-gallery img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .details-gallery img:first-child {
      grid-column: 1 / -1;
      aspect-ratio: 16 / 9;
    }

    .mobile-blur-bg,
    .mobile-details-bar {
      display: none;
    }

    .mobile-details-bar {
      background: #fff;
      border-top: 1px solid #ddd;
      padding: 14px 14px 16px;
    }

    .mobile-details-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .mobile-details-title {
      font-weight: 700;
      font-size: 18px;
    }

    .mobile-details-close {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: #f0f0f0;
      font-size: 18px;
      cursor: pointer;
    }

    .mobile-details-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .mobile-summary-item {
      padding: 9px;
      border-radius: 8px;
      background: #f5f5f5;
    }

    .mobile-summary-label {
      color: #777;
      font-size: 9px;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .mobile-summary-value {
      font-size: 13px;
      font-weight: 700;
    }

    .more-details-button {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 9px;
      background: #222;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 900px) {
      html,
      body {
        height: auto;
        min-height: 100%;
        background: #fff;
      }

      body {
        overflow-x: hidden;
        overflow-y: auto;
      }

      .app {
        width: 100%;
        height: auto;
        min-height: 100vh;
        overflow: visible;
        background: #fff;
      }

      .viewer-area {
        position: relative;
        inset: auto;
        height: 62vh;
        min-height: 380px;
        overflow: hidden;
        background: #111;
      }

      #viewerCanvasWrapper {
        position: absolute;
        inset: 0;
      }

      .mobile-blur-bg {
        display: block;
        position: absolute;
        inset: -28px;
        width: calc(100% + 56px);
        height: calc(100% + 56px);
        object-fit: cover;
        filter: blur(7px) brightness(1.08);
        transform: scale(1.02);
        opacity: 0.88;
        pointer-events: none;
        z-index: 0;
      }

      .side-fill {
        display: none !important;
      }

      #orbitImage {
        z-index: 2;
      }

      #facadeGrid {
        z-index: 12;
      }

      .compass {
        top: 12px;
        left: 12px;
        width: 64px;
        height: 64px;
      }

      .drag-hint {
        bottom: 12px;
        font-size: 12px;
        padding: 8px 13px;
      }

      .finder {
        position: relative;
        left: auto;
        bottom: auto;
        width: 100%;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
        border: 0;
        border-top: 1px solid #ddd;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .finder-controls {
        padding: 12px;
      }

      .finder-grid {
        grid-template-columns: 1fr 1fr;
      }

      .finder-search-row {
        grid-template-columns: 105px 1fr;
      }

      .finder-results {
        max-height: 154px;
        padding: 5px 8px 10px;
      }

      .mobile-details-bar.is-visible {
        display: block;
      }

      body.mobile-apartment-selected .finder {
        display: none;
      }

      .panel {
        position: fixed;
        inset: 0;
        width: 100%;
        max-width: 100%;
        height: 100dvh;
        z-index: 200;
        border-radius: 0;
        transform: translateY(105%);
        opacity: 1;
        transition: transform 0.28s ease;
        border: 0;
      }

      .panel.is-open {
        transform: translateY(0);
      }

      body.panel-open {
        overflow: hidden;
      }

      .details-gallery {
        grid-template-columns: 1fr;
      }

      .details-gallery img:first-child {
        grid-column: auto;
      }
    }

  
    .zoom-controls {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 36;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border-radius: 12px;
      background: rgba(255,255,255,0.94);
      box-shadow: 0 6px 20px rgba(0,0,0,0.16);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .zoom-controls button {
      min-width: 34px;
      height: 34px;
      padding: 0 9px;
      border: 0;
      border-radius: 8px;
      background: #f2f2f2;
      color: #222;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .zoom-controls button:hover {
      background: #e7e7e7;
    }

    #orbitImage,
    #facadeGrid {
      transform-origin: center center;
      transition: transform 0.16s ease;
    }

    @media (max-width: 900px) {
      .zoom-controls {
        right: 12px;
        bottom: 12px;
      }
    }

    /* Permanent right navigation */
    .viewer-area { right: 410px; }
    .finder { position: static; width: 100%; max-height: none; border: 0; border-radius: 0; box-shadow: none; background: transparent; backdrop-filter: none; }
    .finder-controls { padding: 18px; }
    .filter-title { margin: 0 0 12px; font-size: 17px; }
    .filter-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .filter-field { display: flex; flex-direction: column; gap: 5px; color: #747474; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .sort-buttons { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-top: 12px; }
    .sort-button { min-width: 0; height: 38px; padding: 0 4px; border: 1px solid #dedede; border-radius: 8px; background: #f5f5f5; font-size: 10px; font-weight: 700; cursor: pointer; }
    .sort-button.active { background: #191919; color: white; border-color: #191919; }
    .sort-button .arrow { display: inline-block; width: 8px; }
    .finder-results { flex: 1; max-height: none; padding: 8px 10px 18px; }
    .finder-count { padding: 10px 14px 4px; color: #777; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .panel { top: 0; right: 0; width: 410px; max-width: 100vw; height: 100vh; border: 0; border-left: 1px solid #ddd; border-radius: 0; box-shadow: -8px 0 30px rgba(0,0,0,.13); transform: none; opacity: 1; display: flex; flex-direction: column; overflow: hidden; }
    .panel-view { display: none; min-height: 0; flex: 1; flex-direction: column; }
    .panel-view.is-active { display: flex; }
    .panel-header { flex: 0 0 auto; }
    .panel-content { overflow-y: auto; }
    .panel-close { font-size: 14px; font-weight: 700; width: auto; padding: 0 12px; border-radius: 18px; }
    .apartment-tooltip { position: fixed; z-index: 500; display: none; min-width: 190px; padding: 11px 13px; border-radius: 9px; background: rgba(20,20,20,.94); color: #fff; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.28); font-size: 12px; line-height: 1.5; }
    .apartment-tooltip.is-visible { display: block; }
    .tooltip-title { font-size: 14px; font-weight: 800; margin-bottom: 3px; }
    .tooltip-status { opacity: .72; text-transform: capitalize; }
    .zoom-controls { right: 18px; }

    @media (min-width: 901px) {
      body.panel-open #viewerCanvasWrapper, body.panel-open .compass, body.panel-open .finder, body.panel-open .drag-hint { transform: none; }
    }

    @media (max-width: 900px) {
      .viewer-area { right: auto; }
      .panel { position: relative; inset: auto; width: 100%; height: auto; min-height: 38vh; transform: none; border-left: 0; border-top: 1px solid #ddd; }
      .panel-view { min-height: 420px; }
      .finder { display: flex !important; }

    const filterPriceMax = document.getElementById("filterPriceMax");
    const filterRoomsMin = document.getElementById("filterRoomsMin");
    const filterSizeMin = document.getElementById("filterSizeMin");
    const filterFloor = document.getElementById("filterFloor");
    const filterReset = document.getElementById("filterReset");
    const availabilityButton = document.getElementById("availabilityButton");
    const sortButtons = [...document.querySelectorAll("[data-sort]")];
    const finderResults = document.getElementById("finderResults");
    const finderCount = document.getElementById("finderCount");
    const finderView = document.getElementById("finderView");
    const detailsView = document.getElementById("detailsView");
    const apartmentTooltip = document.getElementById("apartmentTooltip");
    const availabilitySummary = document.getElementById("availabilitySummary");
    const menuSections = [...document.querySelectorAll(".section-block")];

    const sidePanel = document.getElementById("sidePanel");
    const panelClose = document.getElementById("panelClose");

    /* =========================================================
       PRELOAD
    ========================================================= */

    const preloadedImages = [];
    let loadedCount = 0;
    let failedCount = 0;
    let currentFrame = 0;

    function updateLoader() {
      const completedFrames = loadedCount + failedCount;
      const percent = Math.round((completedFrames / TOTAL_FRAMES) * 100);
      loaderInfo.textContent = `${percent}%`;
    }

    function finishLoading() {
      currentFrame = 0;

      try {
        setFrame(0);
      } catch (error) {
        console.error("Navigator konnte initial nicht vollständig gerendert werden:", error);
      } finally {
        loader.style.display = "none";
      }
    }

    imagePaths.forEach((src, index) => {
      const img = new Image();

      img.onload = () => {
        loadedCount++;
        updateLoader();

        if (loadedCount + failedCount === TOTAL_FRAMES) {
          finishLoading();
        }
      };

      img.onerror = () => {
        failedCount++;

        console.error(
          "Bild konnte nicht geladen werden:",
          src
        );

        updateLoader();

        if (loadedCount + failedCount === TOTAL_FRAMES) {
          finishLoading();
        }
      };

      img.src = src;
      preloadedImages[index] = img;
    });


    /* =========================================================
       ZOOM
       1.0x to 2.0x. Image and apartment mask are scaled together.
    ========================================================= */
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 2;
    const ZOOM_STEP = 0.1;
    let zoomLevel = 1;
    let zoomIndicatorTimer = null;

    function applyZoom() {
      const transform = `scale(${zoomLevel})`;
      orbitImage.style.transform = transform;
      facadeGrid.style.transform = transform;
      zoomValue.textContent = `${zoomLevel.toFixed(1).replace(".0", "")}×`;
      zoomProgress.style.width = `${(zoomLevel - MIN_ZOOM) / (MAX_ZOOM - MIN_ZOOM) * 100}%`;
    }

    function setZoom(nextZoom) {
      zoomLevel = Math.min(
        MAX_ZOOM,
        Math.max(MIN_ZOOM, Math.round(nextZoom * 10) / 10)
      );
      applyZoom();
    }

    wrapper.addEventListener("wheel", event => {
      if (window.matchMedia("(max-width: 900px)").matches) return;
      event.preventDefault();

      if (event.deltaY < 0) {
        setZoom(zoomLevel + ZOOM_STEP);
      } else {
        setZoom(zoomLevel - ZOOM_STEP);
      }
      zoomIndicator.classList.add("is-visible");
      clearTimeout(zoomIndicatorTimer);
      zoomIndicatorTimer = setTimeout(() => zoomIndicator.classList.remove("is-visible"), 900);
    }, { passive: false });

    /* =========================================================
       FRAME CONTROL
    ========================================================= */

    function normalizeFrame(index) {
      return ((index % TOTAL_FRAMES) + TOTAL_FRAMES) % TOTAL_FRAMES;
    }

    function setFrame(index) {
      currentFrame = normalizeFrame(index);

      const src = imagePaths[currentFrame];

      orbitImage.src = src;
      mobileBlurImage.src = src;
      desktopBlurImage.src = src;
      sideFillLeftImage.src = src;
      sideFillRightImage.src = src;

      updateCompass();
      updateSideFillers();
      updateFacadeGrid();
      applyZoom();
    }

    /* =========================================================
       SIDE-ONLY BLUR
    ========================================================= */

    function updateSideFillers() {
      const image = preloadedImages[currentFrame];

      if (
        !image ||
        !image.naturalWidth ||
        !image.naturalHeight ||
        !wrapper.clientWidth ||
        !wrapper.clientHeight
      ) {
        sideFillLeft.style.width = "0px";
        sideFillRight.style.width = "0px";
        sideFillLeft.classList.remove("is-visible");
        sideFillRight.classList.remove("is-visible");
        return;
      }

      const viewerWidth = wrapper.clientWidth;
      const viewerHeight = wrapper.clientHeight;
      const imageAspect = image.naturalWidth / image.naturalHeight;
      const viewerAspect = viewerWidth / viewerHeight;

      /*
        object-fit: contain
        If viewer is wider than image, side bars appear.
        Only those side bars receive blur.
      */
      if (viewerAspect > imageAspect) {
        const containedWidth = viewerHeight * imageAspect;
        const sideWidth = Math.max(
          0,
          (viewerWidth - containedWidth) / 2
        );

        sideFillLeft.style.width = `${sideWidth}px`;
        sideFillRight.style.width = `${sideWidth}px`;

        sideFillLeft.classList.toggle(
          "is-visible",
          sideWidth > 1
        );

        sideFillRight.classList.toggle(
          "is-visible",
          sideWidth > 1
        );
      } else {
        sideFillLeft.style.width = "0px";
        sideFillRight.style.width = "0px";
        sideFillLeft.classList.remove("is-visible");
        sideFillRight.classList.remove("is-visible");
      }
    }

    window.addEventListener("resize", () => {
      updateSideFillers();
      updateFacadeGrid();
    });

    /* =========================================================
       COMPASS
    ========================================================= */

    function updateCompass() {
      const degreesPerFrame = 360 / TOTAL_FRAMES;

      const heading =
        INITIAL_HEADING_DEG +
        currentFrame * degreesPerFrame;

      /*
        Dial rotates opposite to the camera heading,
        like a normal compass.
      */
      compassDial.style.transform =
        `rotate(${-heading}deg)`;
    }

    /* =========================================================
       DRAGGING
       Direction kept exactly like your current version:
       LEFT  -> previous frame
       RIGHT -> next frame
    ========================================================= */

    let isDragging = false;
    let lastX = 0;
    let dragAccumulator = 0;
    let dragDistance = 0;
    let suppressNextApartmentClick = false;
    let pendingApartmentFromGrid = null;
    let hasInteracted = false;

    function startDragging(event) {
      if (
        event.pointerType === "mouse" &&
        event.button !== 0
      ) {
        return;
      }

      isDragging = true;
      lastX = event.clientX;
      dragAccumulator = 0;
      dragDistance = 0;
      suppressNextApartmentClick = false;

      wrapper.classList.add("is-dragging");

      try {
        wrapper.setPointerCapture(event.pointerId);
      } catch (error) {}

      if (!hasInteracted) {
        hasInteracted = true;
        dragHint.classList.add("hidden");
      }
    }

    function moveDragging(event) {
      if (!isDragging) {
        return;
      }

      const movement = event.clientX - lastX;
      lastX = event.clientX;
      dragAccumulator += movement;
      dragDistance += Math.abs(movement);

      while (
        Math.abs(dragAccumulator) >= PIXELS_PER_FRAME
      ) {
        if (dragAccumulator < 0) {
          setFrame(currentFrame - 1);
          dragAccumulator += PIXELS_PER_FRAME;
        } else {
          setFrame(currentFrame + 1);
          dragAccumulator -= PIXELS_PER_FRAME;
        }
      }
    }

    function stopDragging(event) {
      if (!isDragging) {
        return;
      }

      isDragging = false;
      const wasDrag = dragDistance > 6;
      suppressNextApartmentClick = wasDrag;
      wrapper.classList.remove("is-dragging");

      if (
        event &&
        event.pointerId !== undefined
      ) {
        try {
          wrapper.releasePointerCapture(event.pointerId);
        } catch (error) {}
      }

      if (!wasDrag && pendingApartmentFromGrid) {
        const apartmentToOpen = pendingApartmentFromGrid;
        pendingApartmentFromGrid = null;
        suppressNextApartmentClick = true;
        selectApartment(apartmentToOpen);
      } else {
        pendingApartmentFromGrid = null;
      }

    }

    wrapper.addEventListener("pointerdown", startDragging);
    wrapper.addEventListener("pointermove", moveDragging);
    wrapper.addEventListener("pointerup", stopDragging);
    wrapper.addEventListener("pointercancel", stopDragging);

    /* =========================================================
       KEYBOARD
    ========================================================= */

    window.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") {
        setFrame(currentFrame - 1);
      }

      if (event.key === "ArrowRight") {
        setFrame(currentFrame + 1);
      }

      if (event.key === "Escape") {
        closeDetailsPanel();
      }
    });

    /* =========================================================
       TEMP APARTMENT DATA
       Keep/replace this with your real data later.
    ========================================================= */

    const demoStatuses = [
      "verfügbar", "reserviert", "verkauft", "verfügbar",
      "verkauft", "verfügbar", "reserviert", "verfügbar",
      "verfügbar", "verkauft", "verfügbar", "reserviert",
      "verkauft", "verfügbar", "reserviert", "verfügbar"
    ];

    const interiorGalleryPool = [
      "https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=900&q=82",
      "https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=900&q=82",
      "https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=900&q=82",
      "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=900&q=82",
      "https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=900&q=82",

      "https://images.unsplash.com/photo-1617806118233-18e1de247200?auto=format&fit=crop&w=900&q=82",

    ];

    function getInteriorGallery(topNumber) {
      const start = ((topNumber - 1) * 3) % interiorGalleryPool.length;
      return [0, 1, 2].map(offset => interiorGalleryPool[(start + offset) % interiorGalleryPool.length]);
    }

    const apartments = Array.from({ length: 48 }, (_, index) => {
      const top = index + 1;
      const row = Math.floor(index / 4);

      return {
        id: `Top_${top}`,

    function renderAvailabilitySummary() {
      const labels = { "verfügbar": "Frei", "reserviert": "Reserviert", "verkauft": "Verkauft" };
      const statuses = ["verfügbar", "reserviert", "verkauft"];
      const counts = Object.fromEntries(statuses.map(status => [
        status,
        apartments.filter(apartment => apartment.status === status).length
      ]));
      const total = apartments.length || 1;

      availabilitySummary.innerHTML = `
        <div class="availability-head">
          <span class="availability-total">${apartments.length} Einheiten</span>
        </div>
        <div class="availability-bar" aria-hidden="true">
          ${statuses.map(status => `<span class="availability-segment ${getStatusClass(status).replace("status-", "")}" style="width:${counts[status] / total * 100}%"></span>`).join("")}
        </div>
        <div class="availability-legend">
          ${statuses.map(status => {
            const statusClass = getStatusClass(status).replace("status-", "");
            return `<div class="summary-status"><span class="summary-number">${counts[status]}</span><span class="summary-label"><span class="summary-dot ${statusClass}"></span>${labels[status]}</span></div>`;
          }).join("")}
        </div>`;
    }

    /* =========================================================
       MULTI-GRID RENDERER
       Supports old cropped SVG areas and new full-frame SVG paths.
    ========================================================= */

    function gridLerp(a, b, t) {
      return {
        x: a.x + (b.x - a.x) * t,
        y: a.y + (b.y - a.y) * t
      };
    }

    function gridPointAt(config, row, col) {
      const rows = config.rows;
      const cols = config.cols;

      const topU = config.columnFractionsTop?.[col] ?? (col / cols);
      const bottomU = config.columnFractionsBottom?.[col] ?? (col / cols);
      const leftV = config.rowFractionsLeft?.[row] ?? (row / rows);
      const rightV = config.rowFractionsRight?.[row] ?? (row / rows);

      const topPoint = gridLerp(config.corners[0], config.corners[1], topU);
      const bottomPoint = gridLerp(config.corners[3], config.corners[2], bottomU);
      const averageU = (topU + bottomU) / 2;
      const v = leftV + (rightV - leftV) * averageU;

      return gridLerp(topPoint, bottomPoint, v);
    }

    function getApartmentByTopNumber(topNumber) {
      let apartment = apartments.find(item => item.id === `Top_${topNumber}`);

      if (!apartment) {
        const statusCycle = ["verfügbar", "reserviert", "verkauft"];
        apartment = {
          id: `Top_${topNumber}`,
          number: `Top ${topNumber}`,
          floor: "—",
          size: "—",
          price: "—",
          status: statusCycle[(topNumber - 1) % statusCycle.length],
          rooms: "—",
          orientation: "—",
          outdoor: "—",
          plan: `https://placehold.co/900x650/f4f4f4/333333?text=Demo+Grundriss+Top+${topNumber}`,
          gallery: getInteriorGallery(topNumber)
        };
      }

      return apartment;
    }

    function normalizeApartmentRefs(refValue) {
      const refs = Array.isArray(refValue) ? refValue : [refValue];

      return refs.map(topNumber => {
        return getApartmentByTopNumber(topNumber);
      });
    }

    function setApartmentGroupHover(apartmentIds, active) {
      apartmentIds.forEach(apartmentId => {
        const selector = `[data-apartment-ids~="${apartmentId}"]`;

        facadeGrid.querySelectorAll(selector).forEach(shape => {
          shape.classList.toggle("group-hover", active);
        });
      });
    }

    function fillApartmentTooltip(apartment) {
      const statusClass = getStatusClass(apartment.status).replace("status-", "");
      apartmentTooltip.innerHTML = `
        <div class="tooltip-head"><div class="tooltip-title">${apartment.number}</div><div class="tooltip-status ${statusClass}">${apartment.status}</div></div>
        <div>Fläche: ${apartment.size}</div>
        <div>Zimmer: ${apartment.rooms} · ${apartment.floor}</div>
        <div>Preis: ${apartment.price}</div>`;
    }

    function showApartmentTooltip(apartment, event) {
      fillApartmentTooltip(apartment);
      apartmentTooltip.classList.remove("mobile-pinned");
      apartmentTooltip.classList.add("is-visible");
      moveApartmentTooltip(event);
    }

    function moveApartmentTooltip(event) {
      const gap = 16;
      const width = apartmentTooltip.offsetWidth || 200;
      const height = apartmentTooltip.offsetHeight || 100;
      apartmentTooltip.style.left = `${Math.min(event.clientX + gap, window.innerWidth - width - 10)}px`;
      apartmentTooltip.style.top = `${Math.min(event.clientY + gap, window.innerHeight - height - 10)}px`;
    }

    function hideApartmentTooltip() {
      if (apartmentTooltip.classList.contains("mobile-pinned")) return;
      apartmentTooltip.classList.remove("is-visible");
    }

    function attachApartmentInteraction(shape, apartmentRefs, configName) {
      const apartmentsForShape = normalizeApartmentRefs(apartmentRefs);
      const apartmentIds = apartmentsForShape.map(apartment => apartment.id);

      /*
        A shared visual surface can belong to more than one apartment.
        For the color we use the first mapped apartment as the temporary
        demo status. Individual real statuses can be wired later.
      */
      const primaryApartment = apartmentsForShape[0];
      const statusClass = getStatusClass(primaryApartment.status);

      if (statusClass) {
        shape.classList.add(statusClass);
      }

      shape.dataset.apartmentIds = apartmentIds.join(" ");

      shape.setAttribute(
        "aria-label",
        `${configName}: ${apartmentsForShape.map(a => a.number).join(", ")}`
      );

      shape.addEventListener("pointerenter", event => {
        setApartmentGroupHover(apartmentIds, true);
        showApartmentTooltip(primaryApartment, event);
      });

      shape.addEventListener("pointerleave", () => {
        setApartmentGroupHover(apartmentIds, false);
        hideApartmentTooltip();
      });

      shape.addEventListener("pointermove", moveApartmentTooltip);

      shape.addEventListener("pointerdown", () => {
        /*
          If a shared surface contains several apartments, clicking it opens
          the first apartment named in the Figma layer. All referenced
          apartments still participate in the linked hover.
        */
        pendingApartmentFromGrid = primaryApartment;
      });

      shape.addEventListener("click", event => {
        event.stopPropagation();

        if (suppressNextApartmentClick) {
          suppressNextApartmentClick = false;
          return;
        }

        selectApartment(primaryApartment);
      });
    }

    function renderGridArea(config) {
      const area = document.createElement("div");
      area.className = "facade-grid-area";
      area.dataset.gridName = config.name;

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${config.svgWidth} ${config.svgHeight}`);
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("aria-label", config.name);

      // Single irregular Figma path: keep the exact geometry.
      if (config.path && config.rows === 1 && config.cols === 1) {
        const apartmentRefs = config.apartments[0][0];
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", config.path);
        attachApartmentInteraction(path, apartmentRefs, config.name);
        svg.appendChild(path);
      } else {
        for (let row = 0; row < config.rows; row++) {
          for (let col = 0; col < config.cols; col++) {
            const apartmentRefs = config.apartments[row][col];
            const p1 = gridPointAt(config, row, col);
            const p2 = gridPointAt(config, row, col + 1);
            const p3 = gridPointAt(config, row + 1, col + 1);
            const p4 = gridPointAt(config, row + 1, col);

            const polygon = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "polygon"
            );

            polygon.setAttribute(
              "points",
              `${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y} ${p4.x},${p4.y}`
            );

            attachApartmentInteraction(polygon, apartmentRefs, config.name);
            svg.appendChild(polygon);
          }
        }
      }

      area.appendChild(svg);
      facadeGrid.appendChild(area);
      return area;
    }

    function updateFacadeGrid() {
      facadeGrid.innerHTML = "";

      const shotNumber = currentFrame + 1;
      const configs = FRAME_GRIDS[shotNumber];
      if (!configs) {
        facadeGrid.classList.remove("is-visible");
        return;
      }

      const image = preloadedImages[currentFrame];

      if (
        !image || !image.naturalWidth || !image.naturalHeight ||
        !wrapper.clientWidth || !wrapper.clientHeight
      ) {
        facadeGrid.classList.remove("is-visible");
        return;
      }

      const viewerWidth = wrapper.clientWidth;
      const viewerHeight = wrapper.clientHeight;
      const imageAspect = image.naturalWidth / image.naturalHeight;
      const viewerAspect = viewerWidth / viewerHeight;

      let shownWidth, shownHeight, imageLeft, imageTop;

      const coverImage = window.matchMedia("(min-width: 901px)").matches;

      if (coverImage && viewerAspect > imageAspect) {
        shownWidth = viewerWidth;
        shownHeight = shownWidth / imageAspect;
        imageLeft = 0;
        imageTop = (viewerHeight - shownHeight) / 2;
      } else if (coverImage) {
        shownHeight = viewerHeight;
        shownWidth = shownHeight * imageAspect;
        imageLeft = (viewerWidth - shownWidth) / 2;
        imageTop = 0;
      } else if (viewerAspect > imageAspect) {
        shownHeight = viewerHeight;
        shownWidth = shownHeight * imageAspect;
        imageLeft = (viewerWidth - shownWidth) / 2;
        imageTop = 0;
      } else {
        shownWidth = viewerWidth;
        shownHeight = shownWidth / imageAspect;
        imageLeft = 0;
        imageTop = (viewerHeight - shownHeight) / 2;
      }

      configs.forEach(config => {
        const area = renderGridArea(config);

        if (config.fullFrame) {
          // New workflow: SVG coordinates are already absolute in the 4000x2250 photo.
          const frameOffset = GRID_FRAME_OFFSETS[shotNumber] || { x: 0, y: 0 };
          const offsetScaleX = shownWidth / config.svgWidth;
          const offsetScaleY = shownHeight / config.svgHeight;

          area.style.left = `${imageLeft + frameOffset.x * offsetScaleX}px`;
          area.style.top = `${imageTop + frameOffset.y * offsetScaleY}px`;
          area.style.width = `${shownWidth}px`;
          area.style.height = `${shownHeight}px`;
        } else {
          // Legacy workflow for image 1.
          const gridWidth = shownWidth * (config.widthPct / 100);
          const gridHeight = gridWidth * (config.svgHeight / config.svgWidth);

          area.style.left = `${imageLeft + shownWidth * (config.leftPct / 100)}px`;
          area.style.top = `${imageTop + shownHeight * (config.topPct / 100)}px`;
          area.style.width = `${gridWidth}px`;
          area.style.height = `${gridHeight}px`;
        }
      });

      facadeGrid.classList.add("is-visible");
      updateGridFilterHighlights();
    }

    /* =========================================================
       HELPERS
    ========================================================= */

    function parseNumber(value) {
      if (value === null || value === undefined) {
        return 0;
      }

      const normalized = String(value)
        .replace(/\./g, "")
        .replace(",", ".")
        .replace(/[^\d.-]/g, "");

      return Number(normalized) || 0;
    }

    function getApartmentNumericValue(apartment, field) {
      if (field === "price") {
        return parseNumber(apartment.price);
      }

      if (field === "rooms") {
        return parseNumber(apartment.rooms);
      }

      if (field === "size") {
        return parseNumber(apartment.size);
      }

      return 0;
    }

    function getStatusClass(status) {
      if (status === "verfügbar") {
        return "status-verfuegbar";
      }

      if (status === "reserviert") {
        return "status-reserviert";
      }

      if (status === "verkauft") {
        return "status-verkauft";
      }

      return "";
    }

    /* =========================================================
       FILTER / SEARCH / SORT
    ========================================================= */

    let selectedApartmentId = null;

    let activeSortField = null;
    let activeSortDirection = 1;

    function hasActiveFilters() {
      return Boolean(filterPriceMax.value || filterRoomsMin.value || filterSizeMin.value || filterFloor.value || availabilityToggle.checked);
    }

    function apartmentMatchesFilters(apartment) {
      if (availabilityToggle.checked && apartment.status !== "verfügbar") return false;
      if (filterPriceMax.value && getApartmentNumericValue(apartment, "price") > Number(filterPriceMax.value)) return false;
      if (filterRoomsMin.value && getApartmentNumericValue(apartment, "rooms") < Number(filterRoomsMin.value)) return false;
      if (filterSizeMin.value && getApartmentNumericValue(apartment, "size") < Number(filterSizeMin.value)) return false;
      if (filterFloor.value && apartment.floor !== filterFloor.value) return false;
      return true;
    }

    function getFilteredSortedApartments() {
      let result = apartments.filter(apartment => {
        if (
          availabilityToggle.checked &&
          apartment.status !== "verfügbar"
        ) {
          return false;
        }

        return apartmentMatchesFilters(apartment);
      });

      if (activeSortField) {
        result = [...result].sort((a, b) => (
          getApartmentNumericValue(a, activeSortField) - getApartmentNumericValue(b, activeSortField)
        ) * activeSortDirection);
      }

      return result;
    }

    function renderApartmentResults() {
      finderResults.innerHTML = "";

      const filteredApartments =
        getFilteredSortedApartments();
      filterReset.classList.toggle("is-hidden", !hasActiveFilters());
      finderCount.textContent = `${filteredApartments.length} von ${apartments.length} Wohnungen`;

      if (!filteredApartments.length) {
        finderResults.innerHTML =
          `<div class="finder-empty">
            Keine passenden Wohnungen gefunden.
          </div>`;
        return;
      }

      filteredApartments.forEach(apartment => {
        const button =
          document.createElement("button");

        button.type = "button";
        button.className = "apartment-result";

        if (apartment.id === selectedApartmentId) {
          button.classList.add("selected");
        }

        button.innerHTML = `
          <div>
            <div class="result-title">
              ${apartment.number}
            </div>

            <div class="result-meta">
              ${apartment.floor}
              · ${apartment.rooms} Zimmer
              · ${apartment.size}
              · ${apartment.price}
            </div>
          </div>

          <div class="result-status">
            <span
              class="status-dot ${getStatusClass(apartment.status)}"
            ></span>
            ${apartment.status}
          </div>
        `;

        button.addEventListener("click", () => {
          selectApartment(apartment);
        });

        finderResults.appendChild(button);
      });

      updateGridFilterHighlights();
    }

    function updateGridFilterHighlights() {
      const matchingIds = new Set(getFilteredSortedApartments().map(apartment => apartment.id));
      const filtering = hasActiveFilters();
      facadeGrid.querySelectorAll("[data-apartment-ids]").forEach(shape => {
        const ids = shape.dataset.apartmentIds.split(" ");
        const matches = ids.some(id => matchingIds.has(id));
        shape.classList.toggle("filter-match", filtering && matches);
        shape.classList.toggle("filter-hidden", filtering && !matches);
      });
    }

    function openApartmentListOnMobile() {
      if (!window.matchMedia("(max-width: 900px)").matches) return;
      const section = document.querySelector('[data-section="apartments"]');
      section?.classList.remove("is-collapsed");
      section?.querySelector(".section-toggle")?.setAttribute("aria-expanded", "true");
    }

    [filterPriceMax, filterRoomsMin, filterSizeMin].forEach(input => input.addEventListener("input", () => {
      renderApartmentResults();
      openApartmentListOnMobile();
    }));
    filterFloor.addEventListener("change", () => {
      renderApartmentResults();
      openApartmentListOnMobile();
    });

    filterReset.addEventListener("click", () => {
      filterPriceMax.value = "";
      filterRoomsMin.value = "";
      filterSizeMin.value = "";
      filterFloor.value = "";
      availabilityToggle.checked = false;
      availabilityButton.classList.remove("active");
      availabilityButton.setAttribute("aria-pressed", "false");
      renderApartmentResults();
      openApartmentListOnMobile();
    });

    availabilityButton.addEventListener("click", () => {
      availabilityToggle.checked = !availabilityToggle.checked;
      availabilityButton.classList.toggle("active", availabilityToggle.checked);
      availabilityButton.setAttribute("aria-pressed", String(availabilityToggle.checked));
      renderApartmentResults();
      openApartmentListOnMobile();
    });

    sortButtons.forEach(button => button.addEventListener("click", () => {
      const field = button.dataset.sort;
      if (activeSortField === field) activeSortDirection *= -1;
      else { activeSortField = field; activeSortDirection = 1; }
      sortButtons.forEach(item => {
        const active = item === button;
        item.classList.toggle("active", active);
        item.querySelector(".arrow").textContent = active ? (activeSortDirection === 1 ? "↑" : "↓") : "";
      });
      renderApartmentResults();
      openApartmentListOnMobile();
    }));

    /* =========================================================
       DETAILS
    ========================================================= */

    const detailsCard =
      document.getElementById("detailsCard");

    const detailsTitle =
      document.getElementById("detailsTitle");

    const detailsBadge =
      document.getElementById("detailsBadge");

    const detailsSize =
      document.getElementById("detailsSize");

    const detailsPrice =
      document.getElementById("detailsPrice");

    const detailsRooms =
      document.getElementById("detailsRooms");

    const detailsFloor =
      document.getElementById("detailsFloor");

    const detailsOrientation =
      document.getElementById("detailsOrientation");

    const detailsOutdoor =
      document.getElementById("detailsOutdoor");

    const detailsGallery =
      document.getElementById("detailsGallery");

    const detailsPlan =
      document.getElementById("detailsPlan");

    const detailsPlanEmpty =
      document.getElementById("detailsPlanEmpty");

    function openDetailsPanel() {
      finderView.classList.remove("is-active");
      detailsView.classList.add("is-active");
    }

    function closeDetailsPanel() {
      detailsView.classList.remove("is-active");
      finderView.classList.add("is-active");
    }

    function syncMobileSections(firstRun = false) {
      const mobile = window.matchMedia("(max-width: 900px)").matches;
      if (mobile && zoomLevel !== 1) {
        setZoom(1);
        zoomIndicator.classList.remove("is-visible");
      }
      menuSections.forEach(section => {
        if (firstRun) {
          section.classList.toggle("is-collapsed", section.dataset.section !== "apartments");
        }
        const toggle = section.querySelector(".section-toggle");
        if (toggle) toggle.setAttribute("aria-expanded", String(!section.classList.contains("is-collapsed")));
      });
    }

    menuSections.forEach(section => {
      section.querySelector(".section-toggle")?.addEventListener("click", () => {
        section.classList.toggle("is-collapsed");
        section.querySelector(".section-toggle").setAttribute("aria-expanded", String(!section.classList.contains("is-collapsed")));
      });
    });

    window.addEventListener("resize", () => syncMobileSections(false));

    panelClose.addEventListener("click", closeDetailsPanel);

    function populateFullDetails(apartment) {
      detailsTitle.textContent = apartment.number;
      detailsSize.textContent = apartment.size;
      detailsPrice.textContent = apartment.price;
      detailsRooms.textContent = apartment.rooms;
      detailsFloor.textContent = apartment.floor;
      detailsOrientation.textContent = apartment.orientation;
      detailsOutdoor.textContent = apartment.outdoor;

      detailsBadge.textContent = apartment.status;
      detailsBadge.className = "badge";

      if (apartment.status === "verfügbar") {
        detailsBadge.classList.add("verfuegbar");
      } else if (apartment.status === "reserviert") {
        detailsBadge.classList.add("reserviert");
      } else if (apartment.status === "verkauft") {
        detailsBadge.classList.add("verkauft");
      }

      detailsGallery.innerHTML = "";
      (apartment.gallery || []).forEach((src, index) => {
        const image = document.createElement("img");
        image.src = src;
        image.alt = `${apartment.number} Innenansicht ${index + 1}`;
        image.loading = "lazy";
        detailsGallery.appendChild(image);
      });

      if (apartment.plan) {
        detailsPlan.src = apartment.plan;
        detailsPlan.classList.remove("is-hidden");
        detailsPlanEmpty.style.display = "none";
      } else {
        detailsPlan.src = "";
        detailsPlan.classList.add("is-hidden");
        detailsPlanEmpty.style.display = "block";
      }

      detailsCard.classList.remove("is-hidden");
    }

    function selectApartment(apartment) {
      selectedApartmentId = apartment.id;
      populateFullDetails(apartment);

      if (window.matchMedia("(max-width: 900px)").matches) {
        fillApartmentTooltip(apartment);
        apartmentTooltip.classList.add("is-visible", "mobile-pinned");
      } else {
        apartmentTooltip.classList.remove("mobile-pinned");
      }

      openDetailsPanel();

      renderApartmentResults();
    }

    /* =========================================================
       INIT
    ========================================================= */

    [...new Set(apartments.map(apartment => apartment.floor))].forEach(floor => {
      const option = document.createElement("option");
      option.value = floor;
      option.textContent = floor;
      filterFloor.appendChild(option);
    });
    renderAvailabilitySummary();
    syncMobileSections(true);
    renderApartmentResults();
    updateCompass();
    updateSideFillers();
    updateFacadeGrid();
  </script>
</body>
</html>
