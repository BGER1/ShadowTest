<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wohnungsnavigator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #222;
    }

    body {
      overflow: hidden;
    }

    /* =========================================================
       MAIN LAYOUT
    ========================================================= */

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .viewer-area {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #111;
    }

    /* =========================================================
       ORBIT VIEWER
    ========================================================= */

    #viewerCanvasWrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      background: #111;
    }

    #viewerCanvasWrapper.is-dragging {
      cursor: grabbing;
    }

    /*
      The main photo is always completely sharp.

      If the viewport is wider than the photo aspect ratio,
      only the empty SIDE areas are filled with a blurred copy.
      No blur is used above or below the actual photo.
    */

    .side-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease;
      background: #111;
    }

    .side-fill.is-visible {
      opacity: 1;
    }

    .side-fill img {
      position: absolute;
      top: -25px;
      width: 100vw;
      height: calc(100vh + 50px);
      object-fit: cover;
      object-position: center center;
      filter: blur(28px);
      transform: scale(1.05);
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    #sideFillLeft {
      left: 0;
    }

    #sideFillRight {
      right: 0;
    }

    #sideFillLeft img {
      left: 0;
    }

    #sideFillRight img {
      right: 0;
    }

    #orbitImage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    /* =========================================================
       DRAG HINT
    ========================================================= */

    .drag-hint {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 20;
      padding: 10px 18px;
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .drag-hint.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(10px);
    }

    /* =========================================================
       COMPASS
    ========================================================= */

    .compass {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 30;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 4px 18px rgba(0,0,0,0.18);
      border: 1px solid rgba(0,0,0,0.08);
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .compass-dial {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      transition: transform 0.12s linear;
    }

    .compass-label {
      position: absolute;
      font-size: 10px;
      font-weight: 700;
      color: #333;
      line-height: 1;
    }

    .compass-label.n {
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      color: #b72828;
    }

    .compass-label.e {
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
    }

    .compass-label.s {
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
    }

    .compass-label.w {
      left: 5px;
      top: 50%;
      transform: translateY(-50%);
    }

    .compass-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #222;
      z-index: 2;
    }

    .compass-pointer {
      position: absolute;
      left: 50%;
      top: 8px;
      z-index: 3;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 9px solid #222;
      opacity: 0.75;
    }

    /* =========================================================
       BOTTOM-LEFT SEARCH / FILTER PANEL
    ========================================================= */

    .finder {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 35;
      width: min(380px, calc(100vw - 36px));
      max-height: min(56vh, 520px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 8px 30px rgba(0,0,0,0.22);
      border: 1px solid rgba(0,0,0,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .finder-controls {
      padding: 14px;
      border-bottom: 1px solid #e8e8e8;
    }

    .availability-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 11px;
      font-size: 13px;
      font-weight: 600;
    }

    .availability-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #258a54;
      cursor: pointer;
    }

    .finder-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .finder-control {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      background: #fff;
      color: #222;
      font-size: 12px;
      outline: none;
    }

    .finder-control:focus {
      border-color: #888;
    }

    .finder-search-row {
      display: grid;
      grid-template-columns: 115px 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .finder-results {
      overflow-y: auto;
      padding: 6px;
    }

    .finder-empty {
      padding: 18px 12px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    .apartment-result {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 10px 11px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .apartment-result:hover,
    .apartment-result.selected {
      background: #f0f0f0;
    }

    .result-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .result-meta {
      color: #6e6e6e;
      font-size: 11px;
      line-height: 1.4;
    }

    .result-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      white-space: nowrap;
      text-transform: capitalize;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-verfuegbar {
      background: #2fa66a;
    }

    .status-reserviert {
      background: #e5a400;
    }

    .status-verkauft {
      background: #d34a4a;
    }

    /* =========================================================
       LOADER
    ========================================================= */

    .loader {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #111;
      color: #fff;
    }

    .loader-text {
      font-size: 14px;
    }

    .loader-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      animation: loaderSpin 0.8s linear infinite;
    }

    @keyframes loaderSpin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       RIGHT DETAILS PANEL
       Hidden on startup. Opens only after selecting an apartment.
    ========================================================= */

    .panel {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 50;
      width: 390px;
      max-width: 92vw;
      height: 100vh;
      background: #fff;
      overflow-y: auto;
      border-left: 1px solid #ddd;
      box-shadow: -8px 0 28px rgba(0,0,0,0.14);
      transform: translateX(105%);
      transition: transform 0.28s ease;
    }

    .panel.is-open {
      transform: translateX(0);
    }

    .panel-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid #e7e7e7;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .panel-header-title {
      font-size: 15px;
      font-weight: 700;
    }

    .panel-close {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #f1f1f1;
      color: #222;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .panel-close:hover {
      background: #e7e7e7;
    }

    .panel-content {
      padding: 22px 20px 28px;
    }

    .details-card.is-hidden {
      display: none;
    }

    .details-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 22px;
    }

    .details-title {
      font-size: 24px;
      font-weight: 700;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 20px;
      background: #eee;
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .badge.verfuegbar {
      background: #dff5e8;
      color: #207347;
    }

    .badge.reserviert {
      background: #fff0c5;
      color: #866500;
    }

    .badge.verkauft {
      background: #f7dede;
      color: #963434;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 12px;
    }

    .detail-label {
      margin-bottom: 4px;
      color: #777;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-value {
      font-size: 15px;
      font-weight: 600;
    }

    .plan-wrap {
      margin-top: 28px;
    }

    .details-plan {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .details-plan.is-hidden {
      display: none;
    }

    #detailsPlanEmpty {
      margin-top: 10px;
      color: #888;
      font-size: 13px;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 900px) {
      .compass {
        top: 12px;
        left: 12px;
        width: 68px;
        height: 68px;
      }

      .finder {
        left: 12px;
        bottom: 12px;
        width: min(360px, calc(100vw - 24px));
        max-height: 48vh;
      }

      .finder-grid {
        grid-template-columns: 1fr;
      }

      .finder-search-row {
        grid-template-columns: 105px 1fr;
      }

      .panel {
        width: 100%;
        max-width: 100%;
      }

      .drag-hint {
        bottom: 12px;
      }

      body.panel-open .finder,
      body.panel-open .drag-hint {
        opacity: 0;
        pointer-events: none;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <main class="viewer-area">

      <div id="viewerCanvasWrapper">

        <div class="side-fill" id="sideFillLeft">
          <img id="sideFillLeftImage" src="" alt="" draggable="false">
        </div>

        <div class="side-fill" id="sideFillRight">
          <img id="sideFillRightImage" src="" alt="" draggable="false">
        </div>

        <img
          id="orbitImage"
          src=""
          alt="Gebäudeansicht"
          draggable="false"
        >

      </div>

      <div class="compass" aria-label="Kompass">
        <div class="compass-pointer"></div>

        <div class="compass-dial" id="compassDial">
          <span class="compass-label n">N</span>
          <span class="compass-label e">O</span>
          <span class="compass-label s">S</span>
          <span class="compass-label w">W</span>
          <span class="compass-center"></span>
        </div>
      </div>

      <section class="finder" aria-label="Wohnungssuche">
        <div class="finder-controls">

          <label class="availability-row">
            <input type="checkbox" id="availabilityToggle">
            <span>Nur verfügbare Wohnungen anzeigen</span>
          </label>

          <div class="finder-grid">
            <select id="sortBy" class="finder-control" aria-label="Sortieren">
              <option value="none">Sortieren nach …</option>
              <option value="price-asc">Preis: niedrig → hoch</option>
              <option value="price-desc">Preis: hoch → niedrig</option>
              <option value="rooms-asc">Zimmer: wenig → viele</option>
              <option value="rooms-desc">Zimmer: viele → wenig</option>
              <option value="size-asc">Größe: klein → groß</option>
              <option value="size-desc">Größe: groß → klein</option>
            </select>

            <select id="searchField" class="finder-control" aria-label="Suchparameter">
              <option value="all">Suche: alle Parameter</option>
              <option value="price">Suche nach Preis</option>
              <option value="rooms">Suche nach Zimmer</option>
              <option value="size">Suche nach Größe</option>
            </select>
          </div>

          <div class="finder-search-row">
            <select id="searchOperator" class="finder-control" aria-label="Suchbedingung">
              <option value="contains">enthält / ca.</option>
              <option value="max">maximal</option>
              <option value="min">mindestens</option>
            </select>

            <input
              id="searchInput"
              class="finder-control"
              type="text"
              inputmode="decimal"
              placeholder="z. B. 500000, 3 oder 80"
              autocomplete="off"
            >
          </div>

        </div>

        <div class="finder-results" id="finderResults"></div>
      </section>

      <div class="drag-hint" id="dragHint">
        ← Ziehen zum Drehen →
      </div>

      <div class="loader" id="loader">
        <div class="loader-text" id="loaderInfo">
          Bilder werden geladen…
        </div>
        <div class="loader-spinner"></div>
      </div>

    </main>

    <aside class="panel" id="sidePanel" aria-hidden="true">

      <div class="panel-header">
        <div class="panel-header-title">Wohnungsdetails</div>

        <button
          class="panel-close"
          id="panelClose"
          type="button"
          aria-label="Details schließen"
        >
          ×
        </button>
      </div>

      <div class="panel-content">

        <div id="detailsCard" class="details-card is-hidden">

          <div class="details-top">
            <div class="details-title" id="detailsTitle">Wohnung</div>
            <div id="detailsBadge" class="badge">Status</div>
          </div>

          <div class="details-grid">

            <div class="detail-item">
              <div class="detail-label">Größe</div>
              <div class="detail-value" id="detailsSize">—</div>
            </div>

            <div class="detail-item">
              <div class="detail-label">Preis</div>
              <div class="detail-value" id="detailsPrice">—</div>
            </div>

            <div class="detail-item">
              <div class="detail-label">Zimmer</div>
              <div class="detail-value" id="detailsRooms">—</div>
            </div>

            <div class="detail-item">
              <div class="detail-label">Etage</div>
              <div class="detail-value" id="detailsFloor">—</div>
            </div>

            <div class="detail-item">
              <div class="detail-label">Ausrichtung</div>
              <div class="detail-value" id="detailsOrientation">—</div>
            </div>

            <div class="detail-item">
              <div class="detail-label">Freifläche</div>
              <div class="detail-value" id="detailsOutdoor">—</div>
            </div>

          </div>

          <div class="plan-wrap">
            <div class="detail-label">Grundriss</div>

            <img
              id="detailsPlan"
              class="details-plan is-hidden"
              alt="Grundriss"
            >

            <div id="detailsPlanEmpty">
              Kein Grundriss hinterlegt.
            </div>
          </div>

        </div>
      </div>

    </aside>

  </div>

  <script>
    /* =========================================================
       SETTINGS
    ========================================================= */

    const TOTAL_FRAMES = 26;
    const PIXELS_PER_FRAME = 15;

    /*
      Compass calibration:
      Frame 1 is currently treated as North (0°).
      If frame 1 points in another real direction later,
      change only this value.

      Example:
      Frame 1 points East -> 90
      Frame 1 points South -> 180
      Frame 1 points West -> 270
    */
    const INITIAL_HEADING_DEG = 0;

    /* =========================================================
       IMAGE PATHS
    ========================================================= */

    const imagePaths = [];

    for (let i = 1; i <= TOTAL_FRAMES; i++) {
      imagePaths.push(`models/${i}.jpg`);
    }

    /* =========================================================
       ELEMENTS
    ========================================================= */

    const wrapper = document.getElementById("viewerCanvasWrapper");
    const orbitImage = document.getElementById("orbitImage");

    const sideFillLeft = document.getElementById("sideFillLeft");
    const sideFillRight = document.getElementById("sideFillRight");
    const sideFillLeftImage = document.getElementById("sideFillLeftImage");
    const sideFillRightImage = document.getElementById("sideFillRightImage");

    const loader = document.getElementById("loader");
    const loaderInfo = document.getElementById("loaderInfo");
    const dragHint = document.getElementById("dragHint");
    const compassDial = document.getElementById("compassDial");

    const availabilityToggle = document.getElementById("availabilityToggle");
    const sortBy = document.getElementById("sortBy");
    const searchField = document.getElementById("searchField");
    const searchOperator = document.getElementById("searchOperator");
    const searchInput = document.getElementById("searchInput");
    const finderResults = document.getElementById("finderResults");

    const sidePanel = document.getElementById("sidePanel");
    const panelClose = document.getElementById("panelClose");

    /* =========================================================
       PRELOAD
    ========================================================= */

    const preloadedImages = [];
    let loadedCount = 0;
    let failedCount = 0;
    let currentFrame = 0;

    function updateLoader() {
      loaderInfo.textContent =
        `Lade Bilder ${loadedCount + failedCount} / ${TOTAL_FRAMES}`;
    }

    function finishLoading() {
      currentFrame = 0;
      setFrame(0);
      loader.style.display = "none";
    }

    imagePaths.forEach((src, index) => {
      const img = new Image();

      img.onload = () => {
        loadedCount++;
        updateLoader();

        if (loadedCount + failedCount === TOTAL_FRAMES) {
          finishLoading();
        }
      };

      img.onerror = () => {
        failedCount++;

        console.error(
          "Bild konnte nicht geladen werden:",
          src
        );

        updateLoader();

        if (loadedCount + failedCount === TOTAL_FRAMES) {
          finishLoading();
        }
      };

      img.src = src;
      preloadedImages[index] = img;
    });

    /* =========================================================
       FRAME CONTROL
    ========================================================= */

    function normalizeFrame(index) {
      return ((index % TOTAL_FRAMES) + TOTAL_FRAMES) % TOTAL_FRAMES;
    }

    function setFrame(index) {
      currentFrame = normalizeFrame(index);

      const src = imagePaths[currentFrame];

      orbitImage.src = src;
      sideFillLeftImage.src = src;
      sideFillRightImage.src = src;

      updateCompass();
      updateSideFillers();
    }

    /* =========================================================
       SIDE-ONLY BLUR
    ========================================================= */

    function updateSideFillers() {
      const image = preloadedImages[currentFrame];

      if (
        !image ||
        !image.naturalWidth ||
        !image.naturalHeight ||
        !wrapper.clientWidth ||
        !wrapper.clientHeight
      ) {
        sideFillLeft.style.width = "0px";
        sideFillRight.style.width = "0px";
        sideFillLeft.classList.remove("is-visible");
        sideFillRight.classList.remove("is-visible");
        return;
      }

      const viewerWidth = wrapper.clientWidth;
      const viewerHeight = wrapper.clientHeight;
      const imageAspect = image.naturalWidth / image.naturalHeight;
      const viewerAspect = viewerWidth / viewerHeight;

      /*
        object-fit: contain
        If viewer is wider than image, side bars appear.
        Only those side bars receive blur.
      */
      if (viewerAspect > imageAspect) {
        const containedWidth = viewerHeight * imageAspect;
        const sideWidth = Math.max(
          0,
          (viewerWidth - containedWidth) / 2
        );

        sideFillLeft.style.width = `${sideWidth}px`;
        sideFillRight.style.width = `${sideWidth}px`;

        sideFillLeft.classList.toggle(
          "is-visible",
          sideWidth > 1
        );

        sideFillRight.classList.toggle(
          "is-visible",
          sideWidth > 1
        );
      } else {
        sideFillLeft.style.width = "0px";
        sideFillRight.style.width = "0px";
        sideFillLeft.classList.remove("is-visible");
        sideFillRight.classList.remove("is-visible");
      }
    }

    window.addEventListener("resize", updateSideFillers);

    /* =========================================================
       COMPASS
    ========================================================= */

    function updateCompass() {
      const degreesPerFrame = 360 / TOTAL_FRAMES;

      const heading =
        INITIAL_HEADING_DEG +
        currentFrame * degreesPerFrame;

      /*
        Dial rotates opposite to the camera heading,
        like a normal compass.
      */
      compassDial.style.transform =
        `rotate(${-heading}deg)`;
    }

    /* =========================================================
       DRAGGING
       Direction kept exactly like your current version:
       LEFT  -> previous frame
       RIGHT -> next frame
    ========================================================= */

    let isDragging = false;
    let lastX = 0;
    let dragAccumulator = 0;
    let hasInteracted = false;

    function startDragging(event) {
      if (
        event.pointerType === "mouse" &&
        event.button !== 0
      ) {
        return;
      }

      isDragging = true;
      lastX = event.clientX;
      dragAccumulator = 0;

      wrapper.classList.add("is-dragging");

      try {
        wrapper.setPointerCapture(event.pointerId);
      } catch (error) {}

      if (!hasInteracted) {
        hasInteracted = true;
        dragHint.classList.add("hidden");
      }
    }

    function moveDragging(event) {
      if (!isDragging) {
        return;
      }

      const movement = event.clientX - lastX;
      lastX = event.clientX;
      dragAccumulator += movement;

      while (
        Math.abs(dragAccumulator) >= PIXELS_PER_FRAME
      ) {
        if (dragAccumulator < 0) {
          setFrame(currentFrame - 1);
          dragAccumulator += PIXELS_PER_FRAME;
        } else {
          setFrame(currentFrame + 1);
          dragAccumulator -= PIXELS_PER_FRAME;
        }
      }
    }

    function stopDragging(event) {
      if (!isDragging) {
        return;
      }

      isDragging = false;
      wrapper.classList.remove("is-dragging");

      if (
        event &&
        event.pointerId !== undefined
      ) {
        try {
          wrapper.releasePointerCapture(event.pointerId);
        } catch (error) {}
      }
    }

    wrapper.addEventListener("pointerdown", startDragging);
    wrapper.addEventListener("pointermove", moveDragging);
    wrapper.addEventListener("pointerup", stopDragging);
    wrapper.addEventListener("pointercancel", stopDragging);

    /* =========================================================
       KEYBOARD
    ========================================================= */

    window.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") {
        setFrame(currentFrame - 1);
      }

      if (event.key === "ArrowRight") {
        setFrame(currentFrame + 1);
      }

      if (event.key === "Escape") {
        closeDetailsPanel();
      }
    });

    /* =========================================================
       TEMP APARTMENT DATA
       Keep/replace this with your real data later.
    ========================================================= */

    const apartments = [
      {
        id: "Top_1",
        number: "Top 1",
        floor: "EG",
        size: "72 m²",
        price: "€ 495.000",
        status: "verfügbar",
        rooms: "3",
        orientation: "Süd",
        outdoor: "Terrasse",
        plan: ""
      },
      {
        id: "Top_2",
        number: "Top 2",
        floor: "EG",
        size: "64 m²",
        price: "€ 445.000",
        status: "reserviert",
        rooms: "2",
        orientation: "West",
        outdoor: "Garten",
        plan: ""
      },
      {
        id: "Top_3",
        number: "Top 3",
        floor: "1. OG",
        size: "81 m²",
        price: "€ 575.000",
        status: "verfügbar",
        rooms: "3",
        orientation: "Süd-West",
        outdoor: "Balkon",
        plan: ""
      },
      {
        id: "Top_4",
        number: "Top 4",
        floor: "1. OG",
        size: "93 m²",
        price: "€ 640.000",
        status: "verkauft",
        rooms: "4",
        orientation: "Ost",
        outdoor: "Balkon",
        plan: ""
      }
    ];

    /* =========================================================
       HELPERS
    ========================================================= */

    function parseNumber(value) {
      if (value === null || value === undefined) {
        return 0;
      }

      const normalized = String(value)
        .replace(/\./g, "")
        .replace(",", ".")
        .replace(/[^\d.-]/g, "");

      return Number(normalized) || 0;
    }

    function getApartmentNumericValue(apartment, field) {
      if (field === "price") {
        return parseNumber(apartment.price);
      }

      if (field === "rooms") {
        return parseNumber(apartment.rooms);
      }

      if (field === "size") {
        return parseNumber(apartment.size);
      }

      return 0;
    }

    function getStatusClass(status) {
      if (status === "verfügbar") {
        return "status-verfuegbar";
      }

      if (status === "reserviert") {
        return "status-reserviert";
      }

      if (status === "verkauft") {
        return "status-verkauft";
      }

      return "";
    }

    /* =========================================================
       FILTER / SEARCH / SORT
    ========================================================= */

    let selectedApartmentId = null;

    function apartmentMatchesSearch(apartment) {
      const rawQuery = searchInput.value.trim();

      if (!rawQuery) {
        return true;
      }

      const field = searchField.value;
      const operator = searchOperator.value;
      const queryNumber = parseNumber(rawQuery);

      /*
        "All parameters" searches price, rooms and size together.
      */
      const fields =
        field === "all"
          ? ["price", "rooms", "size"]
          : [field];

      return fields.some(currentField => {
        const apartmentValue =
          getApartmentNumericValue(apartment, currentField);

        if (operator === "max") {
          return apartmentValue <= queryNumber;
        }

        if (operator === "min") {
          return apartmentValue >= queryNumber;
        }

        /*
          For "contains / ca.":
          - numeric equality for rooms
          - text/numeric partial match for price & size
        */
        if (currentField === "rooms") {
          return apartmentValue === queryNumber;
        }

        const apartmentText =
          String(apartmentValue);

        const queryText =
          String(queryNumber);

        return (
          apartmentText.includes(queryText) ||
          Math.abs(apartmentValue - queryNumber) <=
            Math.max(1, apartmentValue * 0.02)
        );
      });
    }

    function getFilteredSortedApartments() {
      let result = apartments.filter(apartment => {
        if (
          availabilityToggle.checked &&
          apartment.status !== "verfügbar"
        ) {
          return false;
        }

        return apartmentMatchesSearch(apartment);
      });

      const sortValue = sortBy.value;

      const sortMap = {
        "price-asc": ["price", 1],
        "price-desc": ["price", -1],
        "rooms-asc": ["rooms", 1],
        "rooms-desc": ["rooms", -1],
        "size-asc": ["size", 1],
        "size-desc": ["size", -1]
      };

      if (sortMap[sortValue]) {
        const [field, direction] = sortMap[sortValue];

        result = [...result].sort((a, b) => {
          return (
            getApartmentNumericValue(a, field) -
            getApartmentNumericValue(b, field)
          ) * direction;
        });
      }

      return result;
    }

    function renderApartmentResults() {
      finderResults.innerHTML = "";

      const filteredApartments =
        getFilteredSortedApartments();

      if (!filteredApartments.length) {
        finderResults.innerHTML =
          `<div class="finder-empty">
            Keine passenden Wohnungen gefunden.
          </div>`;
        return;
      }

      filteredApartments.forEach(apartment => {
        const button =
          document.createElement("button");

        button.type = "button";
        button.className = "apartment-result";

        if (apartment.id === selectedApartmentId) {
          button.classList.add("selected");
        }

        button.innerHTML = `
          <div>
            <div class="result-title">
              ${apartment.number}
            </div>

            <div class="result-meta">
              ${apartment.floor}
              · ${apartment.rooms} Zimmer
              · ${apartment.size}
              · ${apartment.price}
            </div>
          </div>

          <div class="result-status">
            <span
              class="status-dot ${getStatusClass(apartment.status)}"
            ></span>
            ${apartment.status}
          </div>
        `;

        button.addEventListener("click", () => {
          selectApartment(apartment);
        });

        finderResults.appendChild(button);
      });
    }

    availabilityToggle.addEventListener(
      "change",
      renderApartmentResults
    );

    sortBy.addEventListener(
      "change",
      renderApartmentResults
    );

    searchField.addEventListener(
      "change",
      renderApartmentResults
    );

    searchOperator.addEventListener(
      "change",
      renderApartmentResults
    );

    searchInput.addEventListener(
      "input",
      renderApartmentResults
    );

    /* =========================================================
       DETAILS
    ========================================================= */

    const detailsCard =
      document.getElementById("detailsCard");

    const detailsTitle =
      document.getElementById("detailsTitle");

    const detailsBadge =
      document.getElementById("detailsBadge");

    const detailsSize =
      document.getElementById("detailsSize");

    const detailsPrice =
      document.getElementById("detailsPrice");

    const detailsRooms =
      document.getElementById("detailsRooms");

    const detailsFloor =
      document.getElementById("detailsFloor");

    const detailsOrientation =
      document.getElementById("detailsOrientation");

    const detailsOutdoor =
      document.getElementById("detailsOutdoor");

    const detailsPlan =
      document.getElementById("detailsPlan");

    const detailsPlanEmpty =
      document.getElementById("detailsPlanEmpty");

    function openDetailsPanel() {
      sidePanel.classList.add("is-open");
      sidePanel.setAttribute("aria-hidden", "false");
      document.body.classList.add("panel-open");
    }

    function closeDetailsPanel() {
      sidePanel.classList.remove("is-open");
      sidePanel.setAttribute("aria-hidden", "true");
      document.body.classList.remove("panel-open");
    }

    panelClose.addEventListener(
      "click",
      closeDetailsPanel
    );

    function selectApartment(apartment) {
      selectedApartmentId = apartment.id;

      detailsTitle.textContent =
        apartment.number;

      detailsSize.textContent =
        apartment.size;

      detailsPrice.textContent =
        apartment.price;

      detailsRooms.textContent =
        apartment.rooms;

      detailsFloor.textContent =
        apartment.floor;

      detailsOrientation.textContent =
        apartment.orientation;

      detailsOutdoor.textContent =
        apartment.outdoor;

      detailsBadge.textContent =
        apartment.status;

      detailsBadge.className = "badge";

      if (apartment.status === "verfügbar") {
        detailsBadge.classList.add("verfuegbar");
      } else if (apartment.status === "reserviert") {
        detailsBadge.classList.add("reserviert");
      } else if (apartment.status === "verkauft") {
        detailsBadge.classList.add("verkauft");
      }

      if (apartment.plan) {
        detailsPlan.src =
          apartment.plan;

        detailsPlan.classList.remove(
          "is-hidden"
        );

        detailsPlanEmpty.style.display =
          "none";
      } else {
        detailsPlan.src = "";

        detailsPlan.classList.add(
          "is-hidden"
        );

        detailsPlanEmpty.style.display =
          "block";
      }

      detailsCard.classList.remove(
        "is-hidden"
      );

      openDetailsPanel();
      renderApartmentResults();
    }

    /* =========================================================
       INIT
    ========================================================= */

    renderApartmentResults();
    updateCompass();
    updateSideFillers();
  </script>
</body>
