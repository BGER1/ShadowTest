<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wohnungsnavigator</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #222;
    }

    body {
      overflow: hidden;
    }

    /* =========================================================
       MAIN LAYOUT
    ========================================================= */

    .app {
      width: 100vw;
      height: 100vh;
      display: flex;
    }

    .viewer-area {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 100vh;
      overflow: hidden;
      background: #111;
    }


    /* =========================================================
       ORBIT VIEWER
    ========================================================= */

    #viewerCanvasWrapper {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      cursor: grab;

      user-select: none;
      -webkit-user-select: none;

      touch-action: none;

      background: #111;
    }

    #viewerCanvasWrapper.is-dragging {
      cursor: grabbing;
    }


    /* =========================================================
       BLURRED BACKGROUND

       Same photo as the current frame.
       It fills the entire viewer.

       Because the sharp image below is smaller and positioned
       lower, the blur remains especially visible at the top
       as an extended sky/background area.
    ========================================================= */

    #orbitBackground {
      position: absolute;

      inset: -45px;

      width: calc(100% + 90px);
      height: calc(100% + 90px);

      object-fit: cover;

      /*
        Important:
        Bias background upward slightly so the blurred
        area above the image mostly comes from the sky.
      */
      object-position: center 25%;

      filter: blur(30px);

      transform: scale(1.09);

      opacity: 0.95;

      pointer-events: none;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }


    /* =========================================================
       SHARP MAIN IMAGE

       Main photo is:
       - 86% wide
       - 84% high
       - only 4% from top
       - centered horizontally

       Result:
       less border on top of the sharp photo itself,
       while the overall composition gives more sky space.
    ========================================================= */

    #orbitImage {
      position: absolute;

      left: 7%;
      top: 7%;

      width: 86%;
      height: 84%;

      object-fit: contain;

      /*
        Keep actual photo slightly lower inside its area,
        so we don't unnecessarily cut off its sky.
      */
      object-position: center center;

      pointer-events: none;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.15);
    }


    /* =========================================================
       SOFT EDGE

       Creates a more natural transition around the photo.
    ========================================================= */

    #orbitImage {
      -webkit-mask-image:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.96) 0%,
          rgba(0,0,0,1) 5%,
          rgba(0,0,0,1) 94%,
          rgba(0,0,0,0.95) 100%
        );

      mask-image:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.96) 0%,
          rgba(0,0,0,1) 5%,
          rgba(0,0,0,1) 94%,
          rgba(0,0,0,0.95) 100%
        );
    }


    /* =========================================================
       DRAG HINT
    ========================================================= */

    .drag-hint {
      position: absolute;

      left: 50%;
      bottom: 28px;

      transform: translateX(-50%);

      z-index: 10;

      padding: 10px 18px;

      background: rgba(0, 0, 0, 0.55);
      color: white;

      border-radius: 30px;

      font-size: 14px;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      pointer-events: none;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    .drag-hint.hidden {
      opacity: 0;

      transform:
        translateX(-50%)
        translateY(10px);
    }


    /* =========================================================
       FRAME INDICATOR
    ========================================================= */

    .frame-indicator {
      position: absolute;

      top: 20px;
      left: 20px;

      z-index: 10;

      padding: 8px 12px;

      border-radius: 8px;

      background: rgba(0, 0, 0, 0.48);
      color: white;

      font-size: 13px;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      pointer-events: none;
    }


    /* =========================================================
       AVAILABILITY BUTTON
    ========================================================= */

    .availability-toggle {
      position: absolute;

      top: 20px;
      right: 20px;

      z-index: 20;

      padding: 11px 16px;

      border: none;
      border-radius: 8px;

      background: white;
      color: #222;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.18);

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        color 0.2s ease;
    }

    .availability-toggle:hover {
      transform: translateY(-1px);
    }

    .availability-toggle.active {
      background: #258a54;
      color: white;
    }


    /* =========================================================
       LOADER
    ========================================================= */

    .loader {
      position: absolute;
      inset: 0;

      z-index: 100;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 18px;

      background: #111;
      color: white;
    }

    .loader-text {
      font-size: 14px;
    }

    .loader-spinner {
      width: 40px;
      height: 40px;

      border-radius: 50%;

      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: white;

      animation: loaderSpin 0.8s linear infinite;
    }

    @keyframes loaderSpin {

      to {
        transform: rotate(360deg);
      }

    }


    /* =========================================================
       SIDEBAR
    ========================================================= */

    .panel {
      width: 390px;
      height: 100vh;

      flex-shrink: 0;

      background: white;

      overflow-y: auto;

      border-left: 1px solid #ddd;

      box-shadow:
        -4px 0 20px rgba(0,0,0,0.08);

      z-index: 30;
    }


    /* =========================================================
       COLLAPSIBLE SECTIONS
    ========================================================= */

    .panel-section {
      border-bottom: 1px solid #e7e7e7;
    }

    .section-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      padding: 18px 20px;

      background: white;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    .section-arrow {
      transition: transform 0.2s ease;
    }

    .section-collapsible:not(.is-open)
    .section-arrow {
      transform: rotate(-90deg);
    }

    .section-body {
      display: none;

      padding:
        0
        20px
        20px
        20px;
    }

    .section-collapsible.is-open
    .section-body {
      display: block;
    }


    /* =========================================================
       APARTMENT TABLE
    ========================================================= */

    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .info-table th {
      padding: 10px 6px;

      text-align: left;

      color: #777;

      font-size: 10px;
      font-weight: 600;

      text-transform: uppercase;

      border-bottom: 1px solid #ddd;
    }

    .info-table td {
      padding: 11px 6px;

      border-bottom: 1px solid #eee;
    }

    .info-table tbody tr {
      cursor: pointer;

      transition:
        background 0.15s ease;
    }

    .info-table tbody tr:hover {
      background: #f4f4f4;
    }

    .info-table tbody tr.selected {
      background: #e9e9e9;
    }


    /* =========================================================
       STATUS
    ========================================================= */

    .status-dot {
      display: inline-block;

      width: 8px;
      height: 8px;

      margin-right: 5px;

      border-radius: 50%;
    }

    .status-verfuegbar {
      background: #2fa66a;
    }

    .status-reserviert {
      background: #e5a400;
    }

    .status-verkauft {
      background: #d34a4a;
    }


    /* =========================================================
       DETAILS
    ========================================================= */

    .details-card.is-hidden {
      display: none;
    }

    .details-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 20px;
    }

    .details-title {
      font-size: 22px;
      font-weight: 700;
    }

    .badge {
      padding: 6px 10px;

      border-radius: 20px;

      background: #eee;

      font-size: 12px;
      font-weight: 700;
    }

    .badge.verfuegbar {
      background: #dff5e8;

    .badge.reserviert {

    }

    .details-grid {
      display: grid;

      gap:
        18px
        12px;
    }

    .detail-label {
      margin-bottom: 4px;

      text-transform: uppercase;

    }

    .detail-value {

    .plan-wrap {

    .details-plan {
      display: block;

    }

    .details-plan.is-hidden {
      display: none;
    }

    #detailsPlanEmpty {
      margin-top: 10px;

    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 900px) {

      body {
        overflow: auto;
      }

      .app {
        display: block;

        width: 100%;
        height: auto;

      .viewer-area {

      }

  </style>
</head>

<script>

  /* =========================================================
     SETTINGS
  ========================================================= */

  const TOTAL_FRAMES = 26;

  const PIXELS_PER_FRAME = 15;


  /* =========================================================
     IMAGE PATHS
  ========================================================= */

  const imagePaths = [];

  for (
    let i = 1;
    i <= TOTAL_FRAMES;
    i++
  ) {

    imagePaths.push(
      `models/${i}.jpg`
    );

  }


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const wrapper =
    document.getElementById(
      "viewerCanvasWrapper"
    );

  const orbitImage =
    document.getElementById(
      "orbitImage"
    );

  const orbitBackground =
    document.getElementById(
      "orbitBackground"
    );

  const loader =
    document.getElementById(
      "loader"
    );

  const loaderInfo =
    document.getElementById(
      "loaderInfo"
    );

  const frameIndicator =
    document.getElementById(
      "frameIndicator"
    );

  const dragHint =
    document.getElementById(
      "dragHint"
    );

  const availabilityToggle =
    document.getElementById(
      "availabilityToggle"
    );


  /* =========================================================
     PRELOAD
  ========================================================= */

  const preloadedImages = [];

  let loadedCount = 0;

  let failedCount = 0;


  function updateLoader() {

    loaderInfo.textContent =
      `Lade Bilder ${loadedCount} / ${TOTAL_FRAMES}`;

  }


  function finishLoading() {

    currentFrame = 0;

    const src =
      imagePaths[currentFrame];

    orbitImage.src =
      src;

    orbitBackground.src =
      src;

    updateFrameIndicator();

    loader.style.display =
      "none";

  }


  imagePaths.forEach(
    (src, index) => {

      const img =
        new Image();


      img.onload = () => {

        loadedCount++;

        updateLoader();


        if (
          loadedCount +
          failedCount ===
          TOTAL_FRAMES
        ) {

          finishLoading();

        }

      };


      img.onerror = () => {

        failedCount++;


        console.error(
          "Bild konnte nicht geladen werden:",
          src
        );


        if (
          loadedCount +
          failedCount ===
          TOTAL_FRAMES
        ) {

          finishLoading();

        }

      };


      img.src = src;

      preloadedImages[index] =
        img;

    }
  );


  /* =========================================================
     FRAME CONTROL
  ========================================================= */

  let currentFrame = 0;


  function normalizeFrame(index) {

    return (
      (
        index %
        TOTAL_FRAMES
      ) +
      TOTAL_FRAMES
    ) %
    TOTAL_FRAMES;

  }


  function setFrame(index) {

    currentFrame =
      normalizeFrame(index);


    const src =
      imagePaths[currentFrame];


    orbitImage.src =
      src;


    orbitBackground.src =
      src;


    updateFrameIndicator();

  }


  function updateFrameIndicator() {

    frameIndicator.textContent =
      `Ansicht ${currentFrame + 1} / ${TOTAL_FRAMES}`;

  }


  /* =========================================================
     DRAGGING

     IMPORTANT:
     Direction is now REVERSED compared to previous version.
  ========================================================= */

  let isDragging = false;

  let lastX = 0;

  let dragAccumulator = 0;

  let hasInteracted = false;


  function startDragging(event) {

    if (
      event.pointerType === "mouse" &&
      event.button !== 0
    ) {

      return;

    }


    isDragging = true;

    lastX =
      event.clientX;

    dragAccumulator = 0;


    wrapper.classList.add(
      "is-dragging"
    );


    try {

      wrapper.setPointerCapture(
        event.pointerId
      );

    }

    catch (error) {

    }


    if (!hasInteracted) {

      hasInteracted = true;

      dragHint.classList.add(
        "hidden"
      );

    }

  }


  function moveDragging(event) {

    if (!isDragging) {

      return;

    }


    const movement =
      event.clientX -
      lastX;


    lastX =
      event.clientX;


    dragAccumulator +=
      movement;


    while (
      Math.abs(
        dragAccumulator
      ) >=
      PIXELS_PER_FRAME
    ) {


      /*
        REVERSED DIRECTION:

        Drag LEFT
        → previous frame

        Drag RIGHT
        → next frame
      */

      if (
        dragAccumulator < 0
      ) {

        setFrame(
          currentFrame - 1
        );


        dragAccumulator +=
          PIXELS_PER_FRAME;

      }


      else {

        setFrame(
          currentFrame + 1
        );


        dragAccumulator -=
          PIXELS_PER_FRAME;

      }

    }

  }


  function stopDragging(event) {

    if (!isDragging) {

      return;

    }


    isDragging = false;


    wrapper.classList.remove(
      "is-dragging"
    );


    if (
      event &&
      event.pointerId !==
      undefined
    ) {

      try {

        wrapper.releasePointerCapture(
          event.pointerId
        );

      }

      catch (error) {

      }

    }

  }


  wrapper.addEventListener(
    "pointerdown",
    startDragging
  );

  wrapper.addEventListener(
    "pointermove",
    moveDragging
  );

  wrapper.addEventListener(
    "pointerup",
    stopDragging
  );

  wrapper.addEventListener(
    "pointercancel",
    stopDragging
  );


  /* =========================================================
     KEYBOARD

     Also reversed to match dragging.
  ========================================================= */

  window.addEventListener(
    "keydown",
    event => {


      if (
        event.key ===
        "ArrowLeft"
      ) {

        setFrame(
          currentFrame - 1
        );

      }


      if (
        event.key ===
        "ArrowRight"
      ) {

        setFrame(
          currentFrame + 1
        );

      }

    }
  );


  /* =========================================================
     COLLAPSIBLE SIDEBAR
  ========================================================= */

  function setupCollapsible(
    sectionId,
    headerId
  ) {

    const section =
      document.getElementById(
        sectionId
      );

    const header =
      document.getElementById(
        headerId
      );


    header.addEventListener(
      "click",
      () => {

        section.classList.toggle(
          "is-open"
        );

      }
    );

  }


  setupCollapsible(
    "overviewSection",
    "overviewHeader"
  );


  setupCollapsible(
    "detailsSection",
    "detailsHeader"
  );


  /* =========================================================
     TEMP APARTMENT DATA
  ========================================================= */

  const apartments = [

    {
      id: "Top_1",
      number: "Top 1",
      floor: "EG",
      size: "72 m²",
      price: "€ 495.000",
      status: "verfügbar",
      rooms: "3",
      orientation: "Süd",
      outdoor: "Terrasse",
      plan: ""
    },

    {
      id: "Top_2",
      number: "Top 2",
      floor: "EG",
      size: "64 m²",
      price: "€ 445.000",
      status: "reserviert",
      rooms: "2",
      orientation: "West",
      outdoor: "Garten",
      plan: ""
    },

    {
      id: "Top_3",
      number: "Top 3",
      floor: "1. OG",
      size: "81 m²",
      price: "€ 575.000",
      status: "verfügbar",
      rooms: "3",
      orientation: "Süd-West",
      outdoor: "Balkon",
      plan: ""
    },

    {
      id: "Top_4",
      number: "Top 4",
      floor: "1. OG",
      size: "93 m²",
      price: "€ 640.000",
      status: "verkauft",
      rooms: "4",
      orientation: "Ost",
      outdoor: "Balkon",
      plan: ""
    }

  ];


  /* =========================================================
     TABLE
  ========================================================= */

  const infoRows =
    document.getElementById(
      "infoRows"
    );


  let onlyAvailable = false;


  function getStatusClass(
    status
  ) {


    if (
      status === "verfügbar"
    ) {

      return "status-verfuegbar";

    }


    if (
      status === "reserviert"
    ) {

      return "status-reserviert";

    }


    if (
      status === "verkauft"
    ) {

      return "status-verkauft";

    }


    return "";

  }


  function renderApartmentTable() {

    infoRows.innerHTML = "";


    const filteredApartments =

      onlyAvailable

      ?

      apartments.filter(
        apartment =>
          apartment.status ===
          "verfügbar"
      )

      :

      apartments;


    filteredApartments.forEach(
      apartment => {


        const row =
          document.createElement(
            "tr"
          );


        row.innerHTML = `

          <td>
            ${apartment.number}
          </td>

          <td>
            ${apartment.floor}
          </td>

          <td>
            ${apartment.size}
          </td>

          <td>
            ${apartment.price}
          </td>

          <td>

            <span
              class="
                status-dot
                ${getStatusClass(
                  apartment.status
                )}
              "
            ></span>

            ${apartment.status}

          </td>

        `;


        row.addEventListener(
          "click",
          () => {

            selectApartment(
              apartment,
              row
            );

          }
        );


        infoRows.appendChild(
          row
        );

      }
    );

  }


  /* =========================================================
     FILTER
  ========================================================= */

  availabilityToggle.addEventListener(
    "click",
    () => {


      onlyAvailable =
        !onlyAvailable;


      availabilityToggle
        .classList.toggle(
          "active",
          onlyAvailable
        );


      availabilityToggle.textContent =

        onlyAvailable

        ?

        "Alle Wohnungen anzeigen"

        :

        "Nur verfügbare Wohnungen anzeigen";


      renderApartmentTable();

    }
  );


  /* =========================================================
     DETAILS
  ========================================================= */

  const detailsCard =
    document.getElementById(
      "detailsCard"
    );

  const detailsSection =
    document.getElementById(
      "detailsSection"
    );

  const detailsTitle =
    document.getElementById(
      "detailsTitle"
    );

  const detailsBadge =
    document.getElementById(
      "detailsBadge"
    );

  const detailsSize =
    document.getElementById(
      "detailsSize"
    );

  const detailsPrice =
    document.getElementById(
      "detailsPrice"
    );

  const detailsRooms =
    document.getElementById(
      "detailsRooms"
    );

  const detailsFloor =
    document.getElementById(
      "detailsFloor"
    );

  const detailsOrientation =
    document.getElementById(
      "detailsOrientation"
    );

  const detailsOutdoor =
    document.getElementById(
      "detailsOutdoor"
    );

  const detailsPlan =
    document.getElementById(
      "detailsPlan"
    );

  const detailsPlanEmpty =
    document.getElementById(
      "detailsPlanEmpty"
    );


  function selectApartment(
    apartment,
    row
  ) {


    document
      .querySelectorAll(
        ".info-table tbody tr"
      )
      .forEach(
        item => {

          item.classList.remove(
            "selected"
          );

        }
      );


    if (row) {

      row.classList.add(
        "selected"
      );

    }


    detailsTitle.textContent =
      apartment.number;

    detailsSize.textContent =
      apartment.size;

    detailsPrice.textContent =
      apartment.price;

    detailsRooms.textContent =
      apartment.rooms;

    detailsFloor.textContent =
      apartment.floor;

    detailsOrientation.textContent =
      apartment.orientation;

    detailsOutdoor.textContent =
      apartment.outdoor;


    detailsBadge.textContent =
      apartment.status;


    detailsBadge.className =
      "badge";


    if (
      apartment.status ===
      "verfügbar"
    ) {

      detailsBadge.classList.add(
        "verfuegbar"
      );

    }


    else if (
      apartment.status ===
      "reserviert"
    ) {

      detailsBadge.classList.add(
        "reserviert"
      );

    }


    else if (
      apartment.status ===
      "verkauft"
    ) {

      detailsBadge.classList.add(
        "verkauft"
      );

    }


    if (
      apartment.plan
    ) {


      detailsPlan.src =
        apartment.plan;


      detailsPlan.classList.remove(
        "is-hidden"
      );


      detailsPlanEmpty.style.display =
        "none";

    }


    else {


      detailsPlan.src = "";


      detailsPlan.classList.add(
        "is-hidden"
      );


      detailsPlanEmpty.style.display =
        "block";

    }


    detailsCard.classList.remove(
      "is-hidden"
    );


    detailsSection.classList.add(
      "is-open"
    );

  }


  /* =========================================================
     INIT
  ========================================================= */

  renderApartmentTable();

</script>

</body>
</html>
